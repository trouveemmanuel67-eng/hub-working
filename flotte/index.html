<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FLEET MAP</title>
<link rel="icon" href="favicon.ico?v=fm" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png?v=fm">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png?v=fm">
<link rel="icon" type="image/png" sizes="192x192" href="favicon-192.png?v=fm">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=fm">
<meta property="og:title" content="FLEET MAP">
<meta property="og:image" content="https://trouveemmanuel67-eng.github.io/hub-working/flotte/logo-fleet-map-v2.webp">

<meta property="og:image:height" content="618">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100vh;overflow:hidden;background:#1a1817;color:#fff;font-family:Inter,"Helvetica Neue",Helvetica,Arial,sans-serif;font-weight:400}
button,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
a{color:inherit}
.screen{position:relative;height:100vh;overflow:hidden;background:#1a1817}
.mapstage{position:absolute;inset:0;overflow:hidden;background:#1a1817;cursor:grab;touch-action:none;-webkit-user-drag:none;-webkit-touch-callout:none;user-select:none}
.mapstage img,.mapstage canvas{-webkit-user-drag:none;user-select:none}
.mapcover>img{pointer-events:none}
.mapstage.panning,.mapstage.panning *{cursor:grabbing}
.mapworld{position:absolute;inset:0}
.mapcover{position:absolute;top:0;left:0}
.mapcover>img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:center;filter:none;opacity:1;display:block}
#hots{position:absolute;inset:0;pointer-events:none;z-index:2}
.hot{position:absolute;z-index:2;background:transparent;padding:0;cursor:pointer;pointer-events:auto;overflow:visible}
.mapcover>img.roads{
  z-index:1;pointer-events:none;opacity:0;transition:opacity 250ms ease;
  --rx:50%;--ry:30%;--rr:160px;
  -webkit-mask-image:radial-gradient(circle var(--rr) at var(--rx) var(--ry), #fff 0%, #fff 22%, rgba(255,255,255,.55) 48%, rgba(255,255,255,.16) 74%, transparent 100%);
  mask-image:radial-gradient(circle var(--rr) at var(--rx) var(--ry), #fff 0%, #fff 22%, rgba(255,255,255,.55) 48%, rgba(255,255,255,.16) 74%, transparent 100%);
  -webkit-mask-repeat:no-repeat;mask-repeat:no-repeat
}
.mapcover>img.roads.on{opacity:.88}
.super{
  position:absolute;z-index:3;padding:0;border:0;background:none;cursor:pointer;
  width:1.65%;height:auto;transform:translate(-50%,-50%);
  filter:drop-shadow(0 1px 1.5px rgba(0,0,0,.85))
}
.super img{display:block;width:100%;height:auto;pointer-events:none}
.citydot{
  position:absolute;z-index:2;pointer-events:none;
  width:0.6193%;aspect-ratio:1;transform:translate(-50%,-50%);
  border-radius:50%;background:#fff;border:0;outline:0
}
.rail{
  position:absolute;z-index:8;
  top:calc(12px + env(safe-area-inset-top, 0px));
  left:calc(12px + env(safe-area-inset-left, 0px));
  bottom:calc(12px + env(safe-area-inset-bottom, 0px));
  width:232px;
  display:flex;flex-direction:column;align-items:stretch;gap:18px;
  padding:22px;
  color:rgba(255,255,255,.75);
  text-shadow:0 1px 2px rgba(0,0,0,.8);
  background:rgba(10,10,10,.45);
  border:1px solid rgba(255,255,255,.85);
  border-top:2px solid rgba(255,255,255,.95);
  border-radius:0;
  box-shadow:0 10px 28px rgba(0,0,0,.45);
  overflow:visible;
  transform:translateX(0);
  transition:transform 220ms ease-out,border-color 220ms ease-out,box-shadow 220ms ease-out
}
.rail-body{
  flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;
  display:flex;flex-direction:column;gap:18px;
  scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.4) transparent
}
.rail-body::-webkit-scrollbar{width:8px}
.rail-body::-webkit-scrollbar-thumb{background:rgba(255,255,255,.35);border-radius:8px}
.rail:hover{
  transform:translateX(3px);
  border-color:#fff;
  border-top-color:#fff;
  box-shadow:0 10px 28px rgba(0,0,0,.45), 0 0 18px rgba(255,255,255,.18)
}
.rail-x{display:none}
.search{
  position:relative;z-index:2;
  display:flex;align-items:center;gap:4px;
  width:100%;height:44px;
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.85);
  border-radius:0;
  padding:0 10px;
  color:rgba(255,255,255,.75);
  transform:translateX(0);
  transition:transform 180ms ease,color 180ms ease,background-color 180ms ease,border-color 180ms ease
}
.search:hover{transform:translateX(6px);color:#fff;background:rgba(255,255,255,.06);border-color:#fff}
.search input{flex:1;width:auto;min-width:0;border:0;outline:none;background:transparent;font-size:16px;letter-spacing:.06em;font-variant-numeric:tabular-nums;color:inherit}
.search .ph{
  position:absolute;left:32px;top:50%;transform:translateY(-50%);
  display:flex;align-items:baseline;gap:6px;pointer-events:none;
  color:rgba(255,255,255,.5);font-size:16px;letter-spacing:.06em;white-space:nowrap
}
.search .ph .ex{color:rgba(255,255,255,.3);font-size:13px;letter-spacing:.03em}
.search .ph[hidden]{display:none}
.suggest{
  position:absolute;top:calc(100% + 8px);left:0;
  width:max-content;max-width:calc(100vw - 36px);
  max-height:min(420px,62vh);overflow:auto;
  background:rgba(10,10,10,.94);
  border:1px solid rgba(255,255,255,.85);
  border-radius:0;
  box-shadow:0 10px 28px rgba(0,0,0,.45);
  padding:8px
}
.suggest[hidden]{display:none}
.gestion{display:flex;flex-direction:column;gap:0}
.gestion-toggle{
  display:flex;align-items:center;justify-content:space-between;
  width:100%;min-height:44px;height:auto;text-align:left;padding:8px 10px;gap:6px;
  border-radius:0;
  border:1px solid rgba(255,255,255,.85);
  background:transparent;
  color:#fff;font-size:12px;font-weight:600;letter-spacing:.06em;
  transform:translateX(0);
  transition:transform 180ms ease,color 180ms ease,background-color 180ms ease,border-color 180ms ease
}
.acc-name{min-width:0;line-height:1.25}
.gestion-toggle:not([aria-expanded="true"]):hover{transform:translateX(6px);color:#fff;background:rgba(255,255,255,.06);border-color:#fff}
.gestion-toggle .chev{opacity:.75;transition:transform 150ms ease}
.acc-count{letter-spacing:0;font-weight:500;color:rgba(255,255,255,.72)}
.gestion-toggle[aria-expanded="true"]{
  background:#1c1c1c;color:#e6e6e6;font-weight:600;
  border-color:transparent;border-top:3px solid #d9d9d9
}
.gestion-toggle[aria-expanded="true"] .chev{transform:rotate(180deg)}
.gestion-list{display:flex;flex-direction:column;gap:0}
.sms-item{
  display:flex;align-items:center;gap:4px;min-height:32px;padding:4px 0;
  border-top:1px solid rgba(255,255,255,.28);min-width:0
}
.sms-site{flex:0 0 auto;font-size:12px;font-weight:600;color:#fff;white-space:nowrap}
.sms-sc{
  flex:1 1 auto;min-width:0;font-size:9px;line-height:1;letter-spacing:.01em;
  color:rgba(255,255,255,.55);white-space:nowrap;overflow:hidden;text-overflow:ellipsis
}
.sms-copy{
  flex:0 0 auto;margin-left:auto;border:1px solid rgba(255,255,255,.4);background:transparent;
  color:#d1d1d6;font-size:10px;font-weight:600;letter-spacing:.03em;
  padding:2px 5px;cursor:pointer
}
.sms-copy:hover{color:#fff;border-color:#fff}
.cityrole{
  position:absolute;z-index:2;pointer-events:none;transform:translate(-50%,1px);
  font-size:10px;line-height:1;letter-spacing:.12em;white-space:nowrap;
  color:rgba(255,255,255,.7);text-shadow:0 1px 2px rgba(0,0,0,.85)
}
.gestion-list[hidden]{display:none}
.glink{
  display:flex;align-items:center;justify-content:flex-start;
  height:44px;padding:0 12px;border-radius:0;text-decoration:none;
  border:0;border-top:3px solid transparent;
  background:linear-gradient(rgba(255,255,255,.55),rgba(255,255,255,.55)) top / 100% 1px no-repeat;
  color:rgba(255,255,255,.55);
  font-size:13px;font-weight:400;letter-spacing:.04em;
  transform:translateX(0);
  transition:transform 180ms ease,color 180ms ease,background-color 180ms ease,border-color 180ms ease
}
.glink:not(.is-on):hover{
  transform:translateX(6px);color:#fff;
  background-color:rgba(255,255,255,.06);
  background-image:linear-gradient(#fff,#fff);
  background-size:100% 1px;background-repeat:no-repeat;background-position:top
}
.glink.is-on{
  background:#1c1c1c;color:#e6e6e6;font-weight:600;
  border-top-color:#d9d9d9
}
.glink.is-empty{cursor:pointer}
.soon{margin:0;height:44px;display:flex;align-items:center;padding:0 12px;color:rgba(255,255,255,.4);font-size:13px;font-weight:400;border-top:1px solid rgba(255,255,255,.28)}
.navbtn{
  display:none;position:absolute;z-index:12;
  top:calc(16px + env(safe-area-inset-top, 0px));
  left:calc(12px + env(safe-area-inset-left, 0px));
  width:40px;height:40px;place-items:center;
  border-radius:0;color:#fff;font-size:18px;
  background:rgba(10,10,10,.62);
  border:1px solid rgba(255,255,255,.85);
  box-shadow:0 10px 28px rgba(0,0,0,.45)
}
.wordmark{
  position:absolute;z-index:9;margin:0;line-height:0;pointer-events:none;font-weight:400;
  top:calc(20px + env(safe-area-inset-top, 0px));
  left:calc(244px + (100% - 244px) / 2);
  transform:translateX(-50%);
  width:290px
}
.wordmark img{display:block;width:100%;height:auto;filter:drop-shadow(0 1px 2px rgba(0,0,0,.8))}
.tools{
  position:absolute;z-index:9;
  top:calc(12px + env(safe-area-inset-top, 0px));
  right:calc(12px + env(safe-area-inset-right, 0px));
  display:flex;align-items:center;gap:10px
}
.iconbtn{width:40px;height:40px;flex:0 0 auto;display:grid;place-items:center;color:#f2f2f2;border-radius:50%;background:rgba(12,12,14,.72);border:1px solid rgba(255,255,255,.16);backdrop-filter:blur(12px)}
.avatar{width:40px;height:40px;flex:0 0 auto;border-radius:50%;border:1px solid rgba(255,255,255,.16);background:rgba(12,12,14,.72);display:grid;place-items:center;backdrop-filter:blur(12px)}
.avatar span{font-size:11px;letter-spacing:.04em;color:#d1d1d6}
.assist{
  position:fixed;z-index:12;margin:0;
  right:calc(14px + env(safe-area-inset-right, 0px));
  bottom:calc(14px + env(safe-area-inset-bottom, 0px));
  display:flex;flex-direction:column;align-items:flex-end;gap:2px;
  max-width:min(280px, calc(100vw - 28px));
  color:rgba(255,255,255,.62);font-size:12px;line-height:1.35;text-align:right;
  text-shadow:0 1px 2px rgba(0,0,0,.9);pointer-events:none
}
.assist a{pointer-events:auto;color:#d8d8dc;text-decoration:none;font-weight:500;letter-spacing:.02em}
.assist a:hover{color:#fff}
@media (max-width:700px){
  .assist-line{display:none}
  .rail{display:none;bottom:auto;height:auto;max-height:calc(100vh - 24px);width:min(232px, calc(100vw - 24px));overflow:auto}
  .rail.open{display:flex}
  .navbtn{display:grid}
  .screen.menu-open .navbtn{display:none}
  .wordmark{width:180px;left:50%}
  .rail-x{
    display:grid;place-items:center;position:absolute;top:0;right:0;
    width:32px;height:32px;border-radius:0;color:#fff;
    border:1px solid rgba(255,255,255,.85);background:rgba(10,10,10,.4)
  }
}
.fly{
  position:fixed;z-index:18;
  width:max-content;max-width:calc(100vw - 16px);
  overflow:auto;background:#0e0e10;
  border:1px solid rgba(176,176,181,.65);
  border-radius:16px;
  box-shadow:0 12px 32px rgba(0,0,0,.55);
  padding:6px 5px 4px
}
.fly[hidden]{display:none}
.fly-title{display:flex;align-items:baseline;justify-content:space-between;gap:6px;margin:2px 4px 6px;font-size:15px;font-weight:600;white-space:nowrap}
.fly-title .ar{margin-left:auto;font-size:12px;font-weight:400;color:rgba(255,255,255,.55);white-space:nowrap}
.fly .grp,.fly .sub{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.fly .grp{margin:8px 4px 4px;font-size:13px;font-weight:600}
.fly .sub{margin:6px 4px 2px;font-size:12px;font-weight:500;letter-spacing:.03em;color:#d1d1d6}
.fly .grp .n,.fly .sub .n{margin-left:auto;font-size:12px;font-weight:400;color:rgba(255,255,255,.55)}
.fleetmenu{z-index:19;max-height:70vh}
.flyrow{
  height:34px;display:grid;align-items:center;column-gap:3px;
  grid-template-columns:52px 64px 66px 62px 22px;
  width:max-content;padding:0 4px;margin:0 0 4px;border-radius:10px;
  background:#141416;border:1px solid #2c2c2e;
  white-space:nowrap
}
.vinwrap{display:flex;align-items:center;gap:3px;min-width:0}
.vinshort{font-size:12px;font-weight:600;letter-spacing:.01em;color:#fff}
.copy{cursor:pointer;background:none;border:0;padding:0;min-width:0;font-size:12px;font-weight:600;letter-spacing:.01em;color:#fff;text-align:left}
.copy.vin{width:14px;height:14px;flex:0 0 14px;display:grid;place-items:center;color:#9a9aa0;padding:0}
.copy.vin:hover{color:#fff}
.copy.plate{font-weight:500;color:#d1d1d6}
.fly-bat{display:flex;align-items:center;gap:3px;min-width:0;font-size:12px;color:#d1d1d6}
.bar{width:28px;height:5px;border-radius:99px;background:#2a2a2e;overflow:hidden;flex:0 0 auto}
.bar i{display:block;height:100%;border-radius:99px}
.herepill{
  width:auto;box-sizing:border-box;text-align:center;font-size:11px;line-height:1;
  border-radius:999px;padding:3px 6px;
  border:1px solid rgba(176,176,181,.65);color:#d1d1d6
}
.herepill.on{border-color:#3dd68c;color:#d8ffe8}
.start{
  width:22px;height:22px;margin:0;padding:0;justify-self:center;
  border-radius:50%;border:1px solid rgba(255,255,255,.38);
  background:#101012;color:#8e8e93;
  display:grid;place-items:center;cursor:pointer
}
.start.on{
  background:#161816;border-color:#3dd68c;color:#fff;
  box-shadow:0 0 6px rgba(61,214,140,.55)
}
.start:disabled{color:#5c5c60;border-color:rgba(255,255,255,.16);background:#101012;box-shadow:none;cursor:default}
.flyrow.blocked{height:auto;row-gap:3px;padding-top:4px;padding-bottom:5px}
.holdline{grid-column:1 / -1;display:flex;align-items:center;gap:6px;min-width:0;margin:0}
.holdwhy{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px;font-weight:400;color:rgba(255,255,255,.45)}
.holdback{flex:0 0 auto;font-size:12px;font-weight:600;color:#fff;letter-spacing:.01em}
.tdblock{
  flex:0 0 auto;font-size:9px;font-weight:700;letter-spacing:.04em;line-height:1;
  color:#f0b2a6;border:1px solid rgba(196,92,72,.75);background:rgba(92,28,22,.55);
  border-radius:999px;padding:3px 5px
}
.holdcard{padding:7px 8px 8px;border-top:1px solid rgba(255,255,255,.28);display:flex;flex-direction:column;gap:3px;min-width:0}
.holdtop{display:flex;align-items:center;gap:6px;min-width:0;flex-wrap:wrap}
.holdsite{margin-left:auto;font-size:11px;font-weight:500;color:#d1d1d6;white-space:nowrap}
.panel-line{margin:0;font-size:11px;line-height:1.35;color:rgba(255,255,255,.78);min-width:0}
.panel-muted{color:rgba(255,255,255,.48)}
.pv-status{font-size:10px;font-weight:700;letter-spacing:.03em;text-transform:uppercase}
.pv-status.wait{color:#e4b15a}
.pv-status.set{color:#d1d1d6}
.pv-status.paid{color:#8fd9b0}
.toast{
  position:fixed;z-index:40;left:50%;bottom:28px;transform:translateX(-50%);
  background:rgba(18,18,20,.92);
  border:1px solid rgba(176,176,181,.65);
  border-radius:999px;padding:8px 14px;font-size:13px;
  box-shadow:0 12px 32px rgba(0,0,0,.55)
}
.toast[hidden]{display:none}
.sheet{position:fixed;inset:0;z-index:20;background:#000;display:flex;flex-direction:column}
.sheet[hidden]{display:none}
.sh{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:16px 16px 8px}
.sh h2{margin:0;font-size:22px;font-weight:500}
.sh p{margin:6px 0 0;color:#8e8e93;font-size:13px}
.x{width:32px;height:32px;border-radius:50%;border:1px solid #3a3a3c;color:#fff}
.fiche{margin:8px 16px;padding:14px;border-radius:16px;background:#141416;border:1px solid #2c2c2e}
.fiche h3{margin:0 0 8px;font-size:18px;font-weight:500}
.fiche dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px}
.fiche dt{color:#8e8e93}
.fiche dd{margin:0}
.site{margin:16px 4px 8px;font-size:13px;font-weight:500;letter-spacing:.03em;color:#d1d1d6}
.list{overflow:auto;padding:8px 16px 24px}
.row{width:100%;text-align:left;display:grid;grid-template-columns:12px 1fr auto;gap:10px;align-items:center;padding:14px;margin:0 0 10px;border-radius:16px;border:1px solid #2c2c2e;background:#141416}
.row.on{border-color:#8e8e93}
.dot{width:12px;height:12px;border-radius:50%}
.row b{font-weight:500}
.meta{display:block;color:#8e8e93;font-size:12px;margin-top:3px}
.flake{margin-left:4px}
.pill{font-size:11px;border-radius:999px;padding:4px 8px;border:1px solid #3a3a3c;color:#d1d1d6;white-space:nowrap}
.empty{color:#8e8e93;margin:6px}
:focus-visible{outline:2px solid #fff;outline-offset:2px}
@media(min-width:900px){
  .sheet{left:auto;width:420px;border-left:1px solid #2c2c2e}
}
@media (prefers-reduced-motion:reduce){
  .rail{transition:border-color 220ms ease-out,box-shadow 220ms ease-out}
  .rail:hover{transform:none}
  .search,.gestion-toggle,.glink{transition:color 180ms ease,background-color 180ms ease,border-color 180ms ease}
  .search:hover,.gestion-toggle:hover,.glink:hover{transform:none}
}
</style>
</head>
<body>
<div class="screen menu-open" id="screen">
  <div class="mapstage" id="mapstage">
    <div class="mapworld" id="mapworld">
    <div class="mapcover" id="mapcover">
      <img id="basemap" src="carte-alsace-villes-fond.png" alt="Carte de l'Alsace" draggable="false">
      <img id="roads" class="roads" alt="" decoding="async" draggable="false">
      <button type="button" class="super" data-id="phal" style="left:38.907%;top:12.664%" aria-label="Superchargeur Phalsbourg"><img src="logo-superchargeur.webp" alt="" width="64" height="64" draggable="false"></button>
      <button type="button" class="super" data-id="baden" style="left:88.800%;top:22.070%" aria-label="Superchargeur Baden-Baden"><img src="logo-superchargeur.webp" alt="" width="64" height="64" draggable="false"></button>
      <button type="button" class="super" data-id="die" style="left:14.304%;top:52.915%" aria-label="Superchargeur Saint-Dié-des-Vosges"><img src="logo-superchargeur.webp" alt="" width="64" height="64" draggable="false"></button>
      <button type="button" class="super" data-id="herb" style="left:59.884%;top:59.354%" aria-label="Superchargeur Herbolzheim"><img src="logo-superchargeur.webp" alt="" width="64" height="64" draggable="false"></button>
      <button type="button" class="super" data-id="rei" style="left:61.767%;top:28.873%" aria-label="Superchargeur Reichstett"><img src="logo-superchargeur.webp" alt="" width="64" height="64" draggable="false"></button>
      <button type="button" class="super" data-id="ost" style="left:57.900%;top:39.550%" aria-label="Superchargeur Ostwald"><img src="logo-superchargeur.webp" alt="" width="64" height="64" draggable="false"></button>
      <div id="hots"></div>
    </div>
    <div class="fly" id="fly" hidden></div>
    <div class="fly" id="supercard" hidden></div>
    <div class="fly fleetmenu" id="fleetmenu" hidden></div>
    </div>
  </div>
  <button type="button" class="navbtn" id="navbtn" aria-label="Ouvrir le menu" aria-expanded="true">☰</button>
  <aside class="rail open" id="rail">
    <button type="button" class="rail-x" id="railx" aria-label="Fermer le menu">✕</button>
    <label class="search"><span aria-hidden="true">⌕</span>
      <input id="q" type="text" inputmode="numeric" maxlength="4" autocomplete="off" aria-label="Rechercher un VIN">
      <span class="ph" id="ph">VIN <span class="ex">Ex 327</span></span>
      <div class="suggest" id="suggest" hidden></div>
    </label>
    <div class="rail-body">
    <div class="gestion">
      <button type="button" class="gestion-toggle" id="liens-toggle" aria-expanded="false" aria-controls="liens-list"><span class="acc-name">LIENS UTILES</span><span class="chev" aria-hidden="true">▾</span></button>
      <div class="gestion-list" id="liens-list" hidden></div>

const Y0=Y_SAR-0.30*GAP_Y, Y1=Y_SEL+0.20*GAP_Y;
const ALL_X0=0.2316, ALL_X1=0.8278;
let flyCity=null, flySticky=false, flyTimer=null, toastTimer=null, superTimer=null;

function usefulBox(){
  const stage=$("mapstage").getBoundingClientRect();
  const mobile=window.matchMedia("(max-width:700px)").matches;
  const rail=$("rail");
  const open=!mobile || rail.classList.contains("open");
  if(!open) return {x:0,y:0,w:stage.width,h:stage.height,minMenu:8};
  const rr=rail.getBoundingClientRect();
  if(!mobile){
    const x=rr.right-stage.left+8;
    return {x, y:0, w:Math.max(160, stage.width-x), h:stage.height, minMenu:rr.right+8};
  }
  const right=stage.width-(rr.right-stage.left+8);
  if(right>=320){
    const x=rr.right-stage.left+8;
    return {x, y:0, w:right, h:stage.height, minMenu:rr.right+8};
  }
  const y=Math.max(0, rr.bottom-stage.top+8);
  return {x:0, y, w:stage.width, h:Math.max(180, stage.height-y), minMenu:8};
}
function drawCities(){
  const g=$("hots");
  g.innerHTML="";
  for(const h of HOTS){
    const b=document.createElement("button");
    b.type="button";
    b.className="hot";
    b.style.left=h.left+"%";
    b.style.top=h.top+"%";
    b.style.width=h.width+"%";
    b.style.height=h.height+"%";
    b.setAttribute("aria-label",h.city);
    b.addEventListener("pointerenter",()=>{
      if(flySticky && flyCity!==h.city) return;
      openFly(h.city,false);
    });
    b.addEventListener("pointerleave",scheduleFlyClose);
    b.addEventListener("click",e=>{
      e.stopPropagation();
      if(flySticky && flyCity===h.city) closeFly();
      else openFly(h.city,true);
    });
    g.append(b);
    const dot=document.createElement("span");
    dot.className="citydot";
    dot.style.left=h.cx+"%";
    dot.style.top=h.cy+"%";
    g.append(dot);
    const role=document.createElement("span");
    role.className="cityrole";
    role.textContent=h.city==="Strasbourg"?"Store":"Libre-service";
    role.style.left=((h.nx0+h.nx1)/2)+"%";
    role.style.top=h.ny1+"%";
    g.append(role);
  }
}
function fallbackCopy(text){
  const ta=document.createElement("textarea");
  ta.value=text;
  ta.setAttribute("readonly","");
  ta.style.position="fixed";
  ta.style.top="0";
  ta.style.left="0";
  ta.style.width="2em";
  ta.style.height="2em";
  ta.style.padding="0";
  ta.style.border="none";
  ta.style.outline="none";
  ta.style.boxShadow="none";
  ta.style.background="transparent";
  ta.style.fontSize="16px";
  document.body.appendChild(ta);
  const ios=/ipad|iphone|ipod/i.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
  if(ios){
    ta.readOnly=false;
    ta.contentEditable="true";
    const range=document.createRange();
    range.selectNodeContents(ta);
    const sel=window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
  }
  ta.focus();
  ta.select();
  ta.setSelectionRange(0, text.length);
  try{ document.execCommand("copy"); }catch(e){}
  ta.remove();
}
function copyText(text){
  if(navigator.clipboard && navigator.clipboard.writeText){
    return navigator.clipboard.writeText(text).catch(()=>fallbackCopy(text));
  }
  fallbackCopy(text);
  return Promise.resolve();
}

  }));
  root.querySelectorAll(".start").forEach(b=>b.addEventListener("click",e=>{
    e.stopPropagation();
    e.preventDefault();
    if(started.has(b.dataset.id)) started.delete(b.dataset.id);
    else started.add(b.dataset.id);
    if(!$("fly").hidden) renderFly();
    if(!$("suggest").hidden) renderSuggest();
    if(!$("fleetmenu").hidden){
      const top=$("fleetmenu").scrollTop;
      renderFleetMenu();
      $("fleetmenu").scrollTop=top;
    }
  }));
  if(!onCity) return;
  root.querySelectorAll(".flyrow").forEach(row=>row.addEventListener("click",e=>{

    e.stopPropagation();

function anchorLow(btn){
  const h=HOTS.find(x=>x.city===btn.getAttribute("aria-label"));
  const cover=$("mapcover").getBoundingClientRect();
  return cover.top+Math.max(h.nameBottom,h.markBottom)/100*cover.height;
}
function assistBox(){
  const el=$("assist");
  if(!el) return null;
  const r=el.getBoundingClientRect();
  return {left:r.left, top:r.top, right:r.right, bottom:r.bottom};
}
function dodgeAssist(left, top, w, h){
  const a=assistBox();
  const pad=8;
  if(!a) return {left, top};
  const hit=left+w>a.left-pad && left<a.right+pad && top+h>a.top-pad && top<a.bottom+pad;
  if(!hit) return {left, top};
  const up=a.top-pad-h;
  if(up>=pad) return {left, top:up};
  const side=a.left-pad-w;
  if(side>=pad) return {left:side, top};
  return {left:Math.max(pad, left), top:Math.max(pad, up)};
}
function placeFly(){
  const btn=[...document.querySelectorAll(".hot")].find(b=>b.getAttribute("aria-label")===flyCity);
  const fly=$("fly");
  if(!btn||fly.hidden) return;
  const box=usefulBox();
  const r=btn.getBoundingClientRect();
  const low=anchorLow(btn);
  const gap=8, pad=8;
  const avail=Math.max(220, window.innerWidth-pad-box.minMenu);
  fly.style.width="max-content";
  fly.style.maxWidth=avail+"px";
  const below=window.innerHeight-pad-(low+gap);
  const above=r.top-gap-pad;
  const useBelow=below>=150||below>=above;
  fly.style.maxHeight=Math.max(120, Math.min(480, useBelow?below:above))+"px";
  const w=fly.offsetWidth, h=fly.offsetHeight;
  let top=useBelow?low+gap:Math.max(pad, r.top-gap-h);
  if(top+h>window.innerHeight-pad) top=Math.max(pad, window.innerHeight-pad-h);
  let left=r.left+r.width/2-w/2;
  const maxLeft=window.innerWidth-pad-w;
  left=Math.min(Math.max(box.minMenu, left), Math.max(box.minMenu, maxLeft));
  const spot=dodgeAssist(left, top, w, h);
  fly.style.left=(spot.left-panX)+"px";
  fly.style.top=(spot.top-panY)+"px";
}
function roadRadius(){
  const map=$("mapcover").getBoundingClientRect();
  const scale=map.width/IMG_W||0.22;
  /* 2,3 fois le disque visible de la PR #50 (bord à 68 % de 420 px image). */
  return Math.max(120, 660*scale);
}
function setRoads(city){

  const h=HOTS.find(x=>x.city===city);
  if(!h){ el.classList.remove("on"); return; }
  el.style.setProperty("--rx", h.cx+"%");
  el.style.setProperty("--ry", h.cy+"%");
  el.style.setProperty("--rr", roadRadius().toFixed(1)+"px");
  el.classList.add("on");
}

function layoutMap(){
  const stage=$("mapstage");
  const stageW=stage.clientWidth, stageH=stage.clientHeight;
  if(!stageW||!stageH) return;
  const box=usefulBox();
  const nameTop=Math.min(...HOTS.map(h=>h.ny0))/100;
  const nameBottom=Math.max(...HOTS.map(h=>h.ny1))/100;
  const span=Math.max(0.2, nameBottom-nameTop);
  const bottomMargin=Math.max(72, Math.round(stageH*0.08));
  const mark=document.querySelector(".wordmark");
  const markBottom=mark?mark.getBoundingClientRect().bottom:44;
  const topLimit=box.y>8 ? box.y+12 : Math.max(56, Math.round(markBottom+12));
  const fitH=Math.max(160, stageH-bottomMargin-topLimit);
  const allSpan=(ALL_X1-ALL_X0)*IMG_W+28;
  let scale=fitH/(span*IMG_H);
  if(allSpan*scale>box.w) scale=box.w/allSpan;
  const dispW=IMG_W*scale, dispH=IMG_H*scale;
  let top=topLimit-nameTop*dispH;
  if(box.y>8){
    const minTop=box.y+12-nameTop*dispH;
    if(top<minTop) top=minTop;
  }else{
    const spare=(stageH-bottomMargin)-(top+nameBottom*dispH);
    if(top>0 && spare>0) top-=Math.min(top, spare);
  }
  const leftSafe=box.x-ALL_X0*dispW;
  let left=leftSafe;
  const leftCover=stageW-dispW;
  if(leftCover>left) left=leftCover;
  if(left>0) left=0;
  if(left<leftSafe) left=leftSafe;
  const cover=$("mapcover");
  cover.style.width=dispW+"px";
  cover.style.height=dispH+"px";
  cover.style.left=left+"px";
  cover.style.top=top+"px";
  cover.style.transform="none";
  setPan(panX, panY);
}
let panX=0, panY=0, panPtr=null, suppressClick=false;
function panLimits(){
  const stageW=$("mapstage").clientWidth, stageH=$("mapstage").clientHeight;
  const cover=$("mapcover");
  const left=parseFloat(cover.style.left)||0, top=parseFloat(cover.style.top)||0;
  const dispW=parseFloat(cover.style.width)||0, dispH=parseFloat(cover.style.height)||0;
  let minX=stageW-(left+dispW), maxX=-left;
  let minY=stageH-(top+dispH), maxY=-top;
  if(!(dispW>stageW+0.5)||minX>maxX) minX=maxX=0;
  if(!(dispH>stageH+0.5)||minY>maxY) minY=maxY=0;
  return {minX,maxX,minY,maxY};
}
function setPan(x,y){
  const lim=panLimits();
  panX=Math.min(lim.maxX, Math.max(lim.minX, x));
  panY=Math.min(lim.maxY, Math.max(lim.minY, y));
  $("mapworld").style.transform=`translate(${panX}px,${panY}px)`;
}
function resetPan(){ setPan(0,0); }

function renderLinkList(box, links, active, onPick){
  const entries=Object.entries(links);
  if(!entries.length){ box.innerHTML='<p class="soon">À venir</p>'; return; }
  box.innerHTML=entries.map(([name,url])=>{
    const on=name===active;
    const cls="glink"+(url?"":" is-empty")+(on?" is-on":"");
    const current=on?' aria-current="true"':"";
    if(url) return `<a class="${cls}" data-key="${escAttr(name)}" href="${escAttr(url)}" target="_blank" rel="noopener"${current}>${esc(name)}</a>`;
    return `<a class="${cls}" data-key="${escAttr(name)}" href="#" title="Lien à renseigner"${current}>${esc(name)}</a>`;
  }).join("");
  box.querySelectorAll(".glink").forEach(a=>a.addEventListener("click",e=>{
    if(!links[a.dataset.key]) e.preventDefault();
    onPick(a.dataset.key);
  }));
}

function renderFleetMenu(){

  const trials=["Sarrebourg","Saverne","Roppenheim","Sélestat"].map(city=>({city, rows:vehiclesIn(city)}));
  const trialN=trials.reduce((n,g)=>n+g.rows.length,0);
  $("fleetmenu").innerHTML=fleetHead("Store", store.length)+store.map(v=>flyRow(v,"Strasbourg")).join("")
    +fleetHead("Centres d'essai libre-service", trialN)
    +trials.map(g=>fleetHead(g.city, g.rows.length, true)+g.rows.map(v=>flyRow(v, g.city)).join("")).join("");
  bindRows($("fleetmenu"));
}
let fleetAt=null, holdTimer=null, fleetFromHold=false, blockContext=false;
function closeFleetMenu(){
  $("fleetmenu").hidden=true;
  fleetAt=null;
}
function placeFleetMenu(){
  const box=$("fleetmenu");
  if(box.hidden||!fleetAt) return;
  const pad=8, w=box.offsetWidth, h=box.offsetHeight;
  const left0=Math.min(Math.max(pad, fleetAt.x), window.innerWidth-pad-w);
  const top0=Math.min(Math.max(pad, fleetAt.y), window.innerHeight-pad-h);
  const spot=dodgeAssist(left0, top0, w, h);
  box.style.left=(spot.left-panX)+"px";
  box.style.top=(spot.top-panY)+"px";
}
function openFleetMenu(x, y){
  closeFly();
  closeSuper();
  fleetAt={x, y};
  const box=$("fleetmenu");
  renderFleetMenu();
  box.hidden=false;
  box.style.left="0px";
  box.style.top="0px";
  placeFleetMenu();
}
function closeSuper(){
  clearTimeout(superTimer);
  superTimer=null;
  $("supercard").hidden=true;
}
function scheduleSuperClose(){
  clearTimeout(superTimer);
  superTimer=setTimeout(()=>{
    if(document.querySelector(".super:hover, #supercard:hover")) return;
    closeSuper();
  }, 150);
}
function openSuper(id, anchor){
  if(panPtr&&panPtr.moved) return;
  if($("mapstage").classList.contains("panning")) return;
  closeFly();
  closeFleetMenu();
  const s=SUPERCHARGERS.find(x=>x.id===id); if(!s) return;
  clearTimeout(superTimer);
  const card=$("supercard");
  card.innerHTML=`<p class="fly-title"><span>${esc(s.name)}</span><span class="ar">⇄ ${s.min} min · ${esc(s.near)}</span></p>`;
  card.hidden=false;
  card.style.width=Math.min(420, window.innerWidth-16)+"px";
  card.style.left="0px"; card.style.top="0px";
  const r=anchor.getBoundingClientRect();
  const w=card.offsetWidth, h=card.offsetHeight, pad=8;
  let top=r.bottom+8;
  if(top+h>window.innerHeight-pad) top=Math.max(pad, r.top-8-h);
  let left=r.left+r.width/2-w/2;
  left=Math.min(Math.max(pad,left), window.innerWidth-pad-w);
  const spot=dodgeAssist(left, top, w, h);
  card.style.left=(spot.left-panX)+"px";
  card.style.top=(spot.top-panY)+"px";
}

function rowHtml(v){
  return `<button type="button" class="row${v.id===selected?" on":""}" data-id="${v.id}">
    <span class="dot" style="background:${v.swatch}"></span>
    <span><b>${esc(v.model)} · ${esc(v.color)}</b>${v.winter?"<span class='flake' title='Pack hiver'>❄</span>":""}
      <span class="meta">${esc(v.plate)} · ${v.battery} % · ${v.surPlace?"Site":"Hors site"} · ${esc(centerById[v.center].role)}</span></span>
    <span class="pill">${esc(STATUS[v.status])}</span>
  </button>`;
}
function renderList(){
  const rows=FLEET.filter(visible);
  let title="Toute la flotte";
  let detail="";
  if(scope==="city:Strasbourg"){
    title="Strasbourg";
    detail="Store Sales et essai libre-service";
  }else if(scope&&scope.startsWith("city:")) title=scope.slice(5);
  else if(scope){ const c=centerById[scope]; title=c.city+" · "+c.role; }
  $("ptitle").textContent=title;
  $("pcount").textContent=rows.length+" véhicule"+(rows.length>1?"s":"")+(detail?" · "+detail:"");
  const fiche=$("fiche");
  const v=FLEET.find(x=>x.id===selected);
  if(v&&visible(v)){
    const c=centerById[v.center];
    fiche.hidden=false; fiche.className="fiche";
    fiche.innerHTML=`<h3>${esc(v.model)} ${v.winter?"<span class='flake' title='Pack hiver'>❄</span>":""}</h3>
      <dl>
        <dt>Couleur</dt><dd>${esc(v.color)}</dd>
        <dt>Plaque</dt><dd>${esc(v.plate)}</dd>
        <dt>VIN</dt><dd>${esc(v.vin)}</dd>
        <dt>Centre</dt><dd>${esc(c.city)} · ${esc(c.role)}</dd>
        <dt>Statut</dt><dd><span class="pill">${esc(STATUS[v.status])}</span></dd>
        <dt>Batterie</dt><dd>${v.battery} %</dd>
        <dt>Pack hiver</dt><dd>${v.winter?"Oui":"Non"}</dd>
      </dl>`;
  }else{ fiche.hidden=true; fiche.innerHTML=""; }
  const list=$("list");
  if(!rows.length){ list.innerHTML='<p class="empty">Aucun véhicule ne correspond.</p>'; return; }
  if(scope==="city:Strasbourg"){
    list.innerHTML=["sxb-sales","sxb-essai"].map(id=>{
      const part=rows.filter(v=>v.center===id);
      const head=`<h3 class="site">${esc(centerById[id].role)}</h3>`;
      return head+(part.length?part.map(rowHtml).join(""):'<p class="empty">Aucun véhicule.</p>');
    }).join("");
  }else list.innerHTML=rows.map(rowHtml).join("");
  list.querySelectorAll(".row").forEach(btn=>btn.addEventListener("click",()=>openVehicle(btn.dataset.id)));
}
function openSheet(){ $("sheet").hidden=false; renderList(); }
function openVehicle(id){
  const v=FLEET.find(x=>x.id===id); if(!v) return;
  selected=id;
  openSheet();
}
function renderSuggest(){
  const box=$("suggest");
  const q=vinKey($("q").value);
  if(q.length<3){ box.hidden=true; box.innerHTML=""; return; }
  const hits=FLEET.filter(v=>vinKey(v.vin).endsWith(q));
  box.hidden=false;
  if(!hits.length){ box.innerHTML='<p class="empty">Aucun véhicule</p>'; return; }
  box.innerHTML=hits.map(v=>flyRow(v, centerById[v.center].city, "search")).join("");
  bindRows(box, city=>{
    box.hidden=true;
    openFly(city,true);
  });
}
$("q").addEventListener("input",()=>{
  $("ph").hidden=$("q").value.length>0;
  closeFly();
  renderSuggest();
});
$("close").addEventListener("click",()=>{ $("sheet").hidden=true; selected=null; scope=null; });
$("fly").addEventListener("pointerenter",()=>clearTimeout(flyTimer));
$("fly").addEventListener("pointerleave",scheduleFlyClose);
$("navbtn").addEventListener("click",()=>setMenu(true));
$("railx").addEventListener("click",()=>setMenu(false));
document.querySelectorAll(".gestion-toggle").forEach(btn=>btn.addEventListener("click",()=>{
  const list=document.getElementById(btn.getAttribute("aria-controls"));
  const willOpen=list.hidden;
  list.hidden=!willOpen;
  btn.setAttribute("aria-expanded", willOpen?"true":"false");
  if(window.matchMedia("(max-width:700px)").matches){
    layoutMap();
    if(flyCity){ placeFly(); setRoads(flyCity); }
  }
}));
document.querySelectorAll(".super").forEach(btn=>{
  btn.addEventListener("pointerenter",e=>{
    if(e.pointerType!=="mouse") return;
    if(panPtr&&panPtr.moved) return;
    clearTimeout(superTimer);
    openSuper(btn.dataset.id, btn);
  });
  btn.addEventListener("pointerleave",e=>{
    if(e.pointerType!=="mouse") return;
    scheduleSuperClose();
  });
  btn.addEventListener("click",e=>{
    e.stopPropagation();
    if(suppressClick) return;
    clearTimeout(superTimer);
    openSuper(btn.dataset.id, btn);
  });
});
$("supercard").addEventListener("pointerenter",e=>{
  if(e.pointerType!=="mouse") return;
  clearTimeout(superTimer);
});
$("supercard").addEventListener("pointerleave",e=>{
  if(e.pointerType!=="mouse") return;
  scheduleSuperClose();
});
const stage=$("mapstage");
stage.addEventListener("dragstart",e=>{ e.preventDefault(); });
stage.addEventListener("pointerdown",e=>{
  if(e.pointerType==="mouse" && e.button!==0) return;
  if(e.target.closest("#fly")||e.target.closest("#supercard")||e.target.closest("#fleetmenu")) return;
  const interactive=e.target.closest("button, input, textarea, select, a, label");
  if(!interactive) e.preventDefault();
  panPtr={id:e.pointerId, x:e.clientX, y:e.clientY, ox:panX, oy:panY, moved:false};
  if(!interactive) stage.setPointerCapture(e.pointerId);
  if(e.pointerType==="touch"){
    const x=e.clientX, y=e.clientY;
    clearTimeout(holdTimer);
    holdTimer=setTimeout(()=>{
      fleetFromHold=true;
      openFleetMenu(x, y);
      setTimeout(()=>{ fleetFromHold=false; }, 700);
    }, 500);
  }
});
function movePan(e){
  if(!panPtr||e.pointerId!==panPtr.id) return;
  const dx=e.clientX-panPtr.x, dy=e.clientY-panPtr.y;
  if(!panPtr.moved && Math.hypot(dx,dy)<=5) return;
  clearTimeout(holdTimer);
  if(!panPtr.moved){ closeSuper(); closeFleetMenu(); }
  if(!stage.hasPointerCapture(e.pointerId)) stage.setPointerCapture(e.pointerId);
  panPtr.moved=true;
  stage.classList.add("panning");
  setPan(panPtr.ox+dx, panPtr.oy+dy);
}
stage.addEventListener("pointermove",movePan);
document.addEventListener("pointermove",movePan);
function endPan(e){
  if(!panPtr||e.pointerId!==panPtr.id) return;
  if(panPtr.moved){ suppressClick=true; blockContext=true; }
  panPtr=null;
  stage.classList.remove("panning");
  clearTimeout(holdTimer);
}
stage.addEventListener("pointerup",endPan);
stage.addEventListener("pointercancel",endPan);
document.addEventListener("pointerup",endPan);
stage.addEventListener("click",e=>{
  if(!suppressClick) return;
  suppressClick=false;
  e.preventDefault();
  e.stopPropagation();
}, true);
stage.addEventListener("dblclick",e=>{
  if(e.target.closest("#fly")||e.target.closest("#supercard")||e.target.closest("#fleetmenu")) return;
  resetPan();
});
stage.addEventListener("wheel",e=>{
  if(e.target.closest("#fleetmenu")||e.target.closest("#fly")||e.target.closest("#supercard")) return;
  e.preventDefault();
}, {passive:false});
stage.addEventListener("contextmenu",e=>{
  e.preventDefault();
  if(fleetFromHold) return;
  if(blockContext){ blockContext=false; return; }
  if(panPtr&&panPtr.moved) return;
  if(!$("fleetmenu").hidden){ closeFleetMenu(); return; }
  openFleetMenu(e.clientX, e.clientY);
});
document.addEventListener("click",e=>{
  if(!e.target.closest(".search")) $("suggest").hidden=true;
  if(!e.target.closest(".super") && !e.target.closest("#supercard")) closeSuper();
  if(!e.target.closest("#fleetmenu")) closeFleetMenu();
  if(e.target.closest("#fly")||e.target.closest(".hot")||e.target.closest(".search")||e.target.closest("#toast")||e.target.closest("#supercard")||e.target.closest("#fleetmenu")) return;
  closeFly();
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){ $("suggest").hidden=true; closeFly(); closeSuper(); closeFleetMenu(); $("close").click(); }
});
$("assist-tel").addEventListener("click",e=>{
  const desktop=window.matchMedia("(hover:hover) and (pointer:fine)").matches;
  if(!desktop) return;
  e.preventDefault();
  copyText("09 70 73 08 50").then(()=>showToast("Numéro copié"));
});
renderGestion();
drawCities();
layoutMap();
$("basemap").addEventListener("load",()=>{ layoutMap(); if(flyCity) placeFly(); });
requestAnimationFrame(()=>{ const roads=$("roads"); if(!roads.getAttribute("src")) roads.src="carte-alsace-routes.webp?v=fond"; });
window.addEventListener("resize",()=>{ layoutMap(); if(flyCity){ placeFly(); setRoads(flyCity); } });
</script>
</body>
</html>
