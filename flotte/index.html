<style>
*{box-sizing:border-box}

button,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
a{color:inherit}
.screen{position:relative;height:100vh;overflow:hidden;background:#1a1817}
.mapstage{position:absolute;inset:0;overflow:hidden;background:#1a1817;cursor:grab;touch-action:none;-webkit-user-drag:none;user-select:none}

.mapworld{position:absolute;inset:0}
.mapcover{position:absolute;top:0;left:0}
.mapcover>img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:center;filter:none;opacity:1;display:block}
#hots{position:absolute;inset:0;pointer-events:none;z-index:2}
.hot{position:absolute;z-index:2;background:transparent;padding:0;cursor:pointer;pointer-events:auto;overflow:visible}
.mapcover>img.roads{
  z-index:1;pointer-events:none;opacity:0;transition:opacity 250ms ease;

  mask-image:radial-gradient(circle var(--rr) at var(--rx) var(--ry), #fff 0%, transparent 100%);

}
.mapcover>img.roads.on{opacity:.88}
.super{
  position:absolute;z-index:3;padding:0;border:0;background:none;cursor:pointer;

}
.super img{display:block;width:100%;height:auto;pointer-events:none}
.nameglow{

.hot:hover .nameglow,.hot.on .nameglow{opacity:1}
.rail{
  position:absolute;z-index:8;
  top:calc(12px + env(safe-area-inset-top, 0px));
  left:calc(12px + env(safe-area-inset-left, 0px));
  bottom:calc(12px + env(safe-area-inset-bottom, 0px));
  width:232px;
  display:flex;flex-direction:column;align-items:stretch;gap:18px;
  padding:22px;
  color:rgba(255,255,255,.75);
  text-shadow:0 1px 2px rgba(0,0,0,.8);
  background:rgba(10,10,10,.45);
  border:1px solid rgba(255,255,255,.85);
  border-top:2px solid rgba(255,255,255,.95);
  border-radius:0;
  box-shadow:0 10px 28px rgba(0,0,0,.45);
  overflow:visible;
  transform:translateX(0);
  transition:transform 220ms ease-out,border-color 220ms ease-out,box-shadow 220ms ease-out
}
.rail:hover{
  transform:translateX(3px);
  border-color:#fff;
  border-top-color:#fff;
  box-shadow:0 10px 28px rgba(0,0,0,.45), 0 0 18px rgba(255,255,255,.18)
}
.rail-x{display:none}
.search{
  position:relative;z-index:2;

  border-radius:0;

}
.search:hover{transform:translateX(6px);color:#fff;background:rgba(255,255,255,.06);border-color:#fff}

.search input::placeholder{color:rgba(255,255,255,.45);letter-spacing:.08em}
.suggest{
  position:absolute;top:calc(100% + 8px);left:0;

  max-height:min(420px,62vh);overflow:auto;
  background:rgba(10,10,10,.94);
  border:1px solid rgba(255,255,255,.85);
  border-radius:0;
  box-shadow:0 10px 28px rgba(0,0,0,.45);

}
.suggest[hidden]{display:none}
.gestion{display:flex;flex-direction:column;gap:0}
.gestion-toggle{
  display:flex;align-items:center;justify-content:space-between;

  border-radius:0;
  border:1px solid rgba(255,255,255,.85);
  background:transparent;
  color:#fff;font-size:13px;font-weight:600;letter-spacing:.08em;
  transform:translateX(0);
  transition:transform 180ms ease,color 180ms ease,background-color 180ms ease,border-color 180ms ease
}
.gestion-toggle:not([aria-expanded="true"]):hover{transform:translateX(6px);color:#fff;background:rgba(255,255,255,.06);border-color:#fff}

.gestion-toggle[aria-expanded="true"]{
  background:#1c1c1c;color:#e6e6e6;font-weight:600;
  border-color:transparent;border-top:3px solid #d9d9d9
}
.gestion-toggle[aria-expanded="true"] .chev{transform:rotate(180deg)}
.gestion-list{display:flex;flex-direction:column;gap:0}
.gestion-list[hidden]{display:none}
.glink{
  display:flex;align-items:center;justify-content:flex-start;
  height:44px;padding:0 12px;border-radius:0;text-decoration:none;
  border:0;border-top:3px solid transparent;
  background:linear-gradient(rgba(255,255,255,.55),rgba(255,255,255,.55)) top / 100% 1px no-repeat;
  color:rgba(255,255,255,.55);
  font-size:13px;font-weight:400;letter-spacing:.04em;
  transform:translateX(0);
  transition:transform 180ms ease,color 180ms ease,background-color 180ms ease,border-color 180ms ease
}
.glink:not(.is-on):hover{
  transform:translateX(6px);color:#fff;
  background-color:rgba(255,255,255,.06);
  background-image:linear-gradient(#fff,#fff);
  background-size:100% 1px;background-repeat:no-repeat;background-position:top
}
.glink.is-on{
  background:#1c1c1c;color:#e6e6e6;font-weight:600;

}

.soon{margin:0;height:44px;display:flex;align-items:center;padding:0 12px;color:rgba(255,255,255,.4);font-size:13px;font-weight:400;border-top:1px solid rgba(255,255,255,.28)}
.navbtn{

}
.wordmark{

.tools{

.copy{cursor:pointer;background:none;border:0;padding:0;min-width:0;font-size:12px;font-weight:600;letter-spacing:.01em;color:#fff;text-align:left}

.fly-bat{display:flex;align-items:center;gap:5px;min-width:0;font-size:12px;color:#d1d1d6}
.bar{width:36px;height:5px;border-radius:99px;background:#2a2a2e;overflow:hidden;flex:0 0 auto}
.bar i{display:block;height:100%;border-radius:99px}
.herepill{
  width:100%;box-sizing:border-box;text-align:center;font-size:11px;line-height:1;

  border:1px solid rgba(176,176,181,.65);color:#d1d1d6
}
.herepill.on{border-color:#3dd68c;color:#d8ffe8}
.herepill .short{display:none}
.start{

  background:transparent;color:#fff;font-size:11px;
  display:inline-flex;align-items:center;justify-content:center;gap:4px
}
.start.on{background:#123524;border-color:#3dd68c;color:#d8ffe8}
.toast{
  position:fixed;z-index:40;left:50%;bottom:28px;transform:translateX(-50%);

  border:1px solid rgba(176,176,181,.65);
  border-radius:999px;padding:8px 14px;font-size:13px;
  box-shadow:0 12px 32px rgba(0,0,0,.55)
}
.toast[hidden]{display:none}
.sheet{position:fixed;inset:0;z-index:20;background:#000;display:flex;flex-direction:column}
.sheet[hidden]{display:none}
.sh{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:16px 16px 8px}
.sh h2{margin:0;font-size:22px;font-weight:500}
.sh p{margin:6px 0 0;color:#8e8e93;font-size:13px}
.x{width:32px;height:32px;border-radius:50%;border:1px solid #3a3a3c;color:#fff}
.fiche{margin:8px 16px;padding:14px;border-radius:16px;background:#141416;border:1px solid #2c2c2e}
.fiche h3{margin:0 0 8px;font-size:18px;font-weight:500}
.fiche dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px}
.fiche dt{color:#8e8e93}
.fiche dd{margin:0}
.site{margin:16px 4px 8px;font-size:13px;font-weight:500;letter-spacing:.03em;color:#d1d1d6}
.list{overflow:auto;padding:8px 16px 24px}
.row{width:100%;text-align:left;display:grid;grid-template-columns:12px 1fr auto;gap:10px;align-items:center;padding:14px;margin:0 0 10px;border-radius:16px;border:1px solid #2c2c2e;background:#141416}
.row.on{border-color:#8e8e93}
.dot{width:12px;height:12px;border-radius:50%}
.row b{font-weight:500}
.meta{display:block;color:#8e8e93;font-size:12px;margin-top:3px}
.flake{margin-left:4px}
.pill{font-size:11px;border-radius:999px;padding:4px 8px;border:1px solid #3a3a3c;color:#d1d1d6;white-space:nowrap}
.empty{color:#8e8e93;margin:6px}
:focus-visible{outline:2px solid #fff;outline-offset:2px}
@media(min-width:900px){
  .sheet{left:auto;width:420px;border-left:1px solid #2c2c2e}
}
@media (prefers-reduced-motion:reduce){
  .rail{transition:border-color 220ms ease-out,box-shadow 220ms ease-out}
  .rail:hover{transform:none}
  .search,.gestion-toggle,.glink{transition:color 180ms ease,background-color 180ms ease,border-color 180ms ease}
  .search:hover,.gestion-toggle:hover,.glink:hover{transform:none}
}
</style>

function usefulBox(){
  const stage=$("mapstage").getBoundingClientRect();
  const mobile=window.matchMedia("(max-width:700px)").matches;
  const rail=$("rail");
  const open=!mobile || rail.classList.contains("open");
  if(!open) return {x:0,y:0,w:stage.width,h:stage.height,minMenu:8};
  const rr=rail.getBoundingClientRect();
  if(!mobile){
    const x=rr.right-stage.left+8;
    return {x, y:0, w:Math.max(160, stage.width-x), h:stage.height, minMenu:rr.right+8};
  }
  const right=stage.width-(rr.right-stage.left+8);
  if(right>=320){
    const x=rr.right-stage.left+8;
    return {x, y:0, w:right, h:stage.height, minMenu:rr.right+8};
  }
  const y=Math.max(0, rr.bottom-stage.top+8);
  return {x:0, y, w:stage.width, h:Math.max(180, stage.height-y), minMenu:8};
}

function fallbackCopy(text){
  const ta=document.createElement("textarea");
  ta.value=text;
  ta.setAttribute("readonly","");
  ta.style.position="fixed";
  ta.style.left="-9999px";
  document.body.appendChild(ta);
  ta.select();
  try{ document.execCommand("copy"); }catch(e){}
  ta.remove();
}
function copyText(text){
  if(navigator.clipboard && navigator.clipboard.writeText){
    return navigator.clipboard.writeText(text).catch(()=>fallbackCopy(text));
  }
  fallbackCopy(text);
  return Promise.resolve();
}

function layoutMap(){
  const stage=$("mapstage");
  const stageW=stage.clientWidth, stageH=stage.clientHeight;
  if(!stageW||!stageH) return;
  const box=usefulBox();
  const nameTop=Math.min(...HOTS.map(h=>h.ny0))/100;
  const nameBottom=Math.max(...HOTS.map(h=>h.ny1))/100;
  const span=Math.max(0.2, nameBottom-nameTop);
  const bottomMargin=Math.max(72, Math.round(stageH*0.08));
  const mark=document.querySelector(".wordmark");
  const markBottom=mark?mark.getBoundingClientRect().bottom:44;
  const topLimit=box.y>8 ? box.y+12 : Math.max(56, Math.round(markBottom+12));
  const fitH=Math.max(160, stageH-bottomMargin-topLimit);
  const allSpan=(ALL_X1-ALL_X0)*IMG_W+28;
  let scale=fitH/(span*IMG_H);
  if(allSpan*scale>box.w) scale=box.w/allSpan;
  const dispW=IMG_W*scale, dispH=IMG_H*scale;
  let top=topLimit-nameTop*dispH;
  if(box.y>8){
    const minTop=box.y+12-nameTop*dispH;
    if(top<minTop) top=minTop;
  }else{
    const spare=(stageH-bottomMargin)-(top+nameBottom*dispH);
    if(top>0 && spare>0) top-=Math.min(top, spare);
  }
  const leftSafe=box.x-ALL_X0*dispW;
  let left=leftSafe;
  const leftCover=stageW-dispW;
  if(leftCover>left) left=leftCover;
  if(left>0) left=0;
  if(left<leftSafe) left=leftSafe;
  const cover=$("mapcover");
  cover.style.width=dispW+"px";
  cover.style.height=dispH+"px";
  cover.style.left=left+"px";
  cover.style.top=top+"px";
  cover.style.transform="none";
  setPan(panX, panY);
}
let panX=0, panY=0, panPtr=null, suppressClick=false;
function panLimits(){
  const stageW=$("mapstage").clientWidth, stageH=$("mapstage").clientHeight;
  const cover=$("mapcover");
  const left=parseFloat(cover.style.left)||0, top=parseFloat(cover.style.top)||0;
  const dispW=parseFloat(cover.style.width)||0, dispH=parseFloat(cover.style.height)||0;
  let minX=stageW-(left+dispW), maxX=-left;
  let minY=stageH-(top+dispH), maxY=-top;
  if(!(dispW>stageW+0.5)||minX>maxX) minX=maxX=0;
  if(!(dispH>stageH+0.5)||minY>maxY) minY=maxY=0;
  return {minX,maxX,minY,maxY};
}
function setPan(x,y){
  const lim=panLimits();
  panX=Math.min(lim.maxX, Math.max(lim.minX, x));
  panY=Math.min(lim.maxY, Math.max(lim.minY, y));
  $("mapworld").style.transform=`translate(${panX}px,${panY}px)`;
}
function resetPan(){ setPan(0,0); }
function paintNames(){
  const src=$("basemap");
  if(!src.naturalWidth) return;
  document.querySelectorAll(".nameglow").forEach(c=>{
    const sx=+c.dataset.sx, sy=+c.dataset.sy, sw=+c.dataset.sw, sh=+c.dataset.sh;
    const dw=Math.max(1, Math.round(sw)), dh=Math.max(1, Math.round(sh));
    c.width=dw; c.height=dh;
    const ctx=c.getContext("2d",{willReadFrequently:true});
    ctx.clearRect(0,0,dw,dh);
    ctx.drawImage(src, sx, sy, sw, sh, 0, 0, dw, dh);
    const image=ctx.getImageData(0,0,dw,dh);
    const d=image.data;
    for(let i=0;i<d.length;i+=4){
      const y=0.2126*d[i]+0.7152*d[i+1]+0.0722*d[i+2];
      d[i+3]=y>150?255:0;
    }
    ctx.putImageData(image,0,0);
  });
}

  }).join("");
  box.querySelectorAll(".glink").forEach(a=>a.addEventListener("click",e=>{
    if(!links[a.dataset.key]) e.preventDefault();
    onPick(a.dataset.key);
  }));
}
function renderGestion(){
  renderLinkList($("liens-list"), LIENS_UTILES_LINKS, liensActive(), selectLien);
  renderLinkList($("release-list"), RELEASE_LINKS, "", ()=>{});
}
function closeSuper(){ $("supercard").hidden=true; }
function openSuper(id, anchor){
  const s=SUPERCHARGERS.find(x=>x.id===id); if(!s) return;
  const card=$("supercard");
  card.innerHTML=`<p class="fly-title"><span>${esc(s.name)}</span><span class="ar">⇄ ${s.min} min · ${esc(s.near)}</span></p>`;
  card.hidden=false;
  card.style.width=Math.min(420, window.innerWidth-16)+"px";
  card.style.left="0px"; card.style.top="0px";
  const r=anchor.getBoundingClientRect();
  const w=card.offsetWidth, h=card.offsetHeight, pad=8;
  let top=r.bottom+8;
  if(top+h>window.innerHeight-pad) top=Math.max(pad, r.top-8-h);
  let left=r.left+r.width/2-w/2;
  left=Math.min(Math.max(pad,left), window.innerWidth-pad-w);
  card.style.left=(left-panX)+"px";
  card.style.top=(top-panY)+"px";
}

function rowHtml(v){
  return `<button type="button" class="row${v.id===selected?" on":""}" data-id="${v.id}">
    <span class="dot" style="background:${v.swatch}"></span>
    <span><b>${esc(v.model)} · ${esc(v.color)}</b>${v.winter?"<span class='flake' title='Pack hiver'>❄</span>":""}
      <span class="meta">${esc(v.plate)} · ${v.battery} % · ${v.surPlace?"Sur place":"Pas sur place"} · ${esc(centerById[v.center].role)}</span></span>
    <span class="pill">${esc(STATUS[v.status])}</span>
  </button>`;
}
function renderList(){
  const rows=FLEET.filter(visible);
  let title="Toute la flotte";
  let detail="";
  if(scope==="city:Strasbourg"){
    title="Strasbourg";
    detail="Store Sales et essai libre-service";
  }else if(scope&&scope.startsWith("city:")) title=scope.slice(5);
  else if(scope){ const c=centerById[scope]; title=c.city+" · "+c.role; }
  $("ptitle").textContent=title;
  $("pcount").textContent=rows.length+" véhicule"+(rows.length>1?"s":"")+(detail?" · "+detail:"");
  const fiche=$("fiche");
  const v=FLEET.find(x=>x.id===selected);
  if(v&&visible(v)){
    const c=centerById[v.center];
    fiche.hidden=false; fiche.className="fiche";
    fiche.innerHTML=`<h3>${esc(v.model)} ${v.winter?"<span class='flake' title='Pack hiver'>❄</span>":""}</h3>
      <dl>
        <dt>Couleur</dt><dd>${esc(v.color)}</dd>
        <dt>Plaque</dt><dd>${esc(v.plate)}</dd>
        <dt>VIN</dt><dd>${esc(v.vin)}</dd>
        <dt>Centre</dt><dd>${esc(c.city)} · ${esc(c.role)}</dd>
        <dt>Statut</dt><dd><span class="pill">${esc(STATUS[v.status])}</span></dd>
        <dt>Batterie</dt><dd>${v.battery} %</dd>
        <dt>Pack hiver</dt><dd>${v.winter?"Oui":"Non"}</dd>
      </dl>`;
  }else{ fiche.hidden=true; fiche.innerHTML=""; }
  const list=$("list");
  if(!rows.length){ list.innerHTML='<p class="empty">Aucun véhicule ne correspond.</p>'; return; }
  if(scope==="city:Strasbourg"){
    list.innerHTML=["sxb-sales","sxb-essai"].map(id=>{
      const part=rows.filter(v=>v.center===id);
      const head=`<h3 class="site">${esc(centerById[id].role)}</h3>`;
      return head+(part.length?part.map(rowHtml).join(""):'<p class="empty">Aucun véhicule.</p>');
    }).join("");
  }else list.innerHTML=rows.map(rowHtml).join("");
  list.querySelectorAll(".row").forEach(btn=>btn.addEventListener("click",()=>openVehicle(btn.dataset.id)));
}
function openSheet(){ $("sheet").hidden=false; renderList(); }
function openVehicle(id){
  const v=FLEET.find(x=>x.id===id); if(!v) return;
  selected=id;
  openSheet();
}
function renderSuggest(){
  const box=$("suggest");
  const q=vinKey($("q").value);
  if(q.length<3){ box.hidden=true; box.innerHTML=""; return; }
  const hits=FLEET.filter(v=>vinKey(v.vin).endsWith(q));
  box.hidden=false;
  if(!hits.length){ box.innerHTML='<p class="empty">Aucun véhicule</p>'; return; }
  box.innerHTML=hits.map(v=>flyRow(v, centerById[v.center].city)).join("");
  bindRows(box, city=>{
    box.hidden=true;
    openFly(city,true);
  });
}
$("q").addEventListener("input",()=>{ closeFly(); renderSuggest(); });
$("close").addEventListener("click",()=>{ $("sheet").hidden=true; selected=null; scope=null; });
$("fly").addEventListener("pointerenter",()=>clearTimeout(flyTimer));
$("fly").addEventListener("pointerleave",scheduleFlyClose);
$("navbtn").addEventListener("click",()=>setMenu(true));
$("railx").addEventListener("click",()=>setMenu(false));
document.querySelectorAll(".gestion-toggle").forEach(btn=>btn.addEventListener("click",()=>{
  const list=document.getElementById(btn.getAttribute("aria-controls"));
  const willOpen=list.hidden;
  list.hidden=!willOpen;
  btn.setAttribute("aria-expanded", willOpen?"true":"false");
  if(window.matchMedia("(max-width:700px)").matches){
    layoutMap();
    if(flyCity){ placeFly(); setRoads(flyCity); }
  }
}));
document.querySelectorAll(".super").forEach(btn=>btn.addEventListener("click",e=>{
  e.stopPropagation();
  if(suppressClick) return;
  openSuper(btn.dataset.id, btn);
}));
const stage=$("mapstage");
stage.addEventListener("dragstart",e=>{ e.preventDefault(); });
stage.addEventListener("pointerdown",e=>{
  if(e.pointerType==="mouse" && e.button!==0) return;
  if(e.target.closest("#fly")||e.target.closest("#supercard")) return;
  const interactive=e.target.closest("button, input, textarea, select, a, label");
  if(!interactive) e.preventDefault();
  panPtr={id:e.pointerId, x:e.clientX, y:e.clientY, ox:panX, oy:panY, moved:false};
  if(!interactive) stage.setPointerCapture(e.pointerId);
});
function movePan(e){
  if(!panPtr||e.pointerId!==panPtr.id) return;
  const dx=e.clientX-panPtr.x, dy=e.clientY-panPtr.y;
  if(!panPtr.moved && Math.hypot(dx,dy)<=5) return;
  if(!stage.hasPointerCapture(e.pointerId)) stage.setPointerCapture(e.pointerId);
  panPtr.moved=true;
  stage.classList.add("panning");
  setPan(panPtr.ox+dx, panPtr.oy+dy);
}
stage.addEventListener("pointermove",movePan);
document.addEventListener("pointermove",movePan);
function endPan(e){
  if(!panPtr||e.pointerId!==panPtr.id) return;
  if(panPtr.moved) suppressClick=true;
  panPtr=null;
  stage.classList.remove("panning");
}
stage.addEventListener("pointerup",endPan);
stage.addEventListener("pointercancel",endPan);
document.addEventListener("pointerup",endPan);
stage.addEventListener("click",e=>{
  if(!suppressClick) return;
  suppressClick=false;
  e.preventDefault();
  e.stopPropagation();
}, true);
stage.addEventListener("dblclick",e=>{
  if(e.target.closest("#fly")||e.target.closest("#supercard")) return;
  resetPan();
});
stage.addEventListener("wheel",e=>{ e.preventDefault(); }, {passive:false});
document.addEventListener("click",e=>{
  if(!e.target.closest(".search")) $("suggest").hidden=true;
  if(!e.target.closest(".super") && !e.target.closest("#supercard")) closeSuper();
  if(e.target.closest("#fly")||e.target.closest(".hot")||e.target.closest(".search")||e.target.closest("#toast")||e.target.closest("#supercard")) return;
  closeFly();
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){ $("suggest").hidden=true; closeFly(); closeSuper(); $("close").click(); }
});
renderGestion();
drawCities();
layoutMap();
paintNames();
$("basemap").addEventListener("load",()=>{ paintNames(); layoutMap(); if(flyCity) placeFly(); });
requestAnimationFrame(()=>{ const roads=$("roads"); if(!roads.getAttribute("src")) roads.src="carte-alsace-routes.webp"; });
window.addEventListener("resize",()=>{ layoutMap(); if(flyCity){ placeFly(); setRoads(flyCity); } });
</script>
</body>
</html>
