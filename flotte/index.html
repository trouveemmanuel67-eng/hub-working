FLEET.forEach(v=>{ v.surPlace=!PAS_SUR_PLACE.has(v.id); });
const STATUS = { disponible:"Disponible", "en essai":"En essai", "en charge":"En charge", indisponible:"Indisponible" };
function batColor(n){return n>=70?"#3dd68c":n>=40?"#e4b15a":"#e15d4a"}
const $=id=>document.getElementById(id);
const centerById=Object.fromEntries(CENTERS.map(c=>[c.id,c]));
let scope=null, selected=null, query="";

function norm(s){return String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase()}
function esc(s){return String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]))}
function vinKey(s){return String(s||"").replace(/\s+/g,"").toLowerCase()}
function hit(v){
  const q=vinKey(query);
  if(!q) return true;
  return vinKey(v.vin).endsWith(q);
}
function inScope(v){
  if(!scope) return true;
  if(scope.startsWith("city:")) return centerById[v.center].city===scope.slice(5);
  return v.center===scope;
}
function visible(v){return hit(v)&&inScope(v)}

/* Boîtes mesurées sur les pixels clairs (luminance > 150) de la carte dérivée, hors disque. */

  {city:"Strasbourg", left:57.70, top:32.10, width:10.10, height:5.80, cx:61.82, cy:33.87, nameBottom:37.443, markBottom:34.825, ncx:62.873, ncy:36.506, nx0:58.177, ny0:35.511, nx1:67.569, ny1:37.502, cr:82},

];
const IMG_W=7912, IMG_H=6781;
const Y_SAR=0.1617, Y_SEL=0.5973;
const GAP_Y=Y_SEL-Y_SAR;
const Y0=Y_SAR-0.30*GAP_Y, Y1=Y_SEL+0.20*GAP_Y;
const MID_X=(0.2446+0.8150)/2;
const ALL_X0=0.2316, ALL_X1=0.8278;
const MUST_X0=0.2316, MUST_X1=0.6784;
let flyCity=null, flySticky=false, flyTimer=null;
function visualFor(h){
  const ox=h.ncx/100*IMG_W, oy=h.ncy/100*IMG_H;
  const x0=h.nx0/100*IMG_W, y0=h.ny0/100*IMG_H, x1=h.nx1/100*IMG_W, y1=h.ny1/100*IMG_H;
  const cx=h.cx/100*IMG_W, cy=h.cy/100*IMG_H, cr=h.cr;
  const boxL=Math.min(x0, cx-cr), boxT=Math.min(y0, cy-cr);
  const boxR=Math.max(x1, cx+cr), boxB=Math.max(y1, cy+cr);
  const pts=[[boxL,boxT],[boxR,boxT],[boxL,boxB],[boxR,boxB]];
  let contentR=1;
  for(const [x,y] of pts) contentR=Math.max(contentR, Math.hypot(x-ox, y-oy));
  const fade=56;
  const R=contentR+fade;
  const left=ox-R, top=oy-R, size=2*R;
  const pct=v=>v/size*100;
  return {
    left:left/IMG_W*100, top:top/IMG_H*100,
    width:size/IMG_W*100, height:size/IMG_H*100,
    eA:Math.max(0, pct(boxL-left)-pct(fade)),
    e0:pct(boxL-left), e1:pct(boxR-left),
    eB:Math.min(100, pct(boxR-left)+pct(fade)),
    fA:Math.max(0, pct(boxT-top)-pct(fade)),
    f0:pct(boxT-top), f1:pct(boxB-top),
    fB:Math.min(100, pct(boxB-top)+pct(fade))
  };
}
function drawCities(){
  const g=$("hots");
  g.innerHTML="";
  for(const h of HOTS){
    const b=document.createElement("button");
    b.type="button";
    b.className="hot";
    b.style.left=h.left+"%";
    b.style.top=h.top+"%";
    b.style.width=h.width+"%";
    b.style.height=h.height+"%";
    b.setAttribute("aria-label",h.city);
    const ox=(h.cx-h.left)/h.width*100, oy=(h.cy-h.top)/h.height*100;
    b.dataset.ox=String(ox);
    b.dataset.oy=String(oy);
    const vis=visualFor(h);
    const zoom=document.createElement("span");
    zoom.className="zoom";
    zoom.style.left=((vis.left-h.left)/h.width*100)+"%";
    zoom.style.top=((vis.top-h.top)/h.height*100)+"%";
    zoom.style.width=(vis.width/h.width*100)+"%";
    zoom.style.height=(vis.height/h.height*100)+"%";
    const zox=(h.ncx-vis.left)/vis.width*100, zoy=(h.ncy-vis.top)/vis.height*100;
    zoom.style.setProperty("--ox", zox+"%");
    zoom.style.setProperty("--oy", zoy+"%");
    for(const k of ["eA","e0","e1","eB","fA","f0","f1","fB"]) zoom.style.setProperty("--"+k, vis[k].toFixed(2)+"%");
    const cover=document.createElement("canvas");
    cover.className="cover";
    const glow=document.createElement("canvas");
    glow.className="glow";
    zoom.append(cover, glow);
    b.append(zoom);
    b.addEventListener("pointerenter",()=>{
      if(flySticky && flyCity!==h.city) return;
      openFly(h.city,false);
    });
    b.addEventListener("pointerleave",scheduleFlyClose);
    b.addEventListener("click",e=>{
      e.stopPropagation();
      if(flySticky && flyCity===h.city) closeFly();
      else openFly(h.city,true);
    });
    g.append(b);
  }
}
function flyRow(v){
  const here=v.surPlace;
  const sub=[v.model,v.plate,v.winter?"pack hiver":""].filter(Boolean).join(" · ");
  return `<div class="flyrow">
    <div class="fly-top"><span class="fly-vin">${esc(v.vin)}</span>
      <span class="fly-bat"><span class="bar"><i style="width:${v.battery}%;background:${batColor(v.battery)}"></i></span>${v.battery} %</span></div>
    <div class="fly-sub">${esc(sub)}</div>
    <div class="fly-here"><span class="here${here?" on":""}"></span>${here?"Sur place":"Pas sur place"}</div>
  </div>`;
}
function renderFly(){
  const rows=FLEET.filter(v=>centerById[v.center].city===flyCity);
  const box=$("fly");
  let body="";
  if(flyCity==="Strasbourg"){
    body=["sxb-sales","sxb-essai"].map(id=>{
      const part=rows.filter(v=>v.center===id);
      return `<h3 class="site">${esc(centerById[id].role)}</h3>`+(part.length?part.map(flyRow).join(""):'<p class="empty">Aucun véhicule.</p>');
    }).join("");
  }else body=rows.map(flyRow).join("");
  box.innerHTML=`<p class="fly-title">${esc(flyCity)}</p>`+body;
}
function grownBox(btn){
  const r=btn.getBoundingClientRect();
  const ox=parseFloat(btn.dataset.ox)/100, oy=parseFloat(btn.dataset.oy)/100;
  const s=SCALE;
  const oxp=r.left+ox*r.width, oyp=r.top+oy*r.height;
  return {
    top:oyp-(oyp-r.top)*s,
    bottom:oyp+(r.bottom-oyp)*s,
    left:oxp-(oxp-r.left)*s,
    right:oxp+(r.right-oxp)*s,
    midX:oxp
  };
}
function anchorLow(btn){
  const h=HOTS.find(x=>x.city===btn.getAttribute("aria-label"));
  const cover=$("mapcover").getBoundingClientRect();
  const oy=cover.top+h.ncy/100*cover.height;
  const y=cover.top+Math.max(h.nameBottom,h.markBottom)/100*cover.height;
  return oy+(y-oy)*SCALE;
}
function placeFly(){
  const btn=[...document.querySelectorAll(".hot")].find(b=>b.getAttribute("aria-label")===flyCity);
  const fly=$("fly");
  if(!btn||fly.hidden) return;
  const g=grownBox(btn);
  const low=anchorLow(btn);
  const gap=8, pad=8;
  const below=window.innerHeight-pad-(low+gap);
  const above=g.top-gap-pad;
  const useBelow=below>=150||below>=above;
  fly.style.maxHeight=Math.max(120, Math.min(480, useBelow?below:above))+"px";
  fly.style.left="0px";
  fly.style.top="0px";
  const w=fly.offsetWidth, h=fly.offsetHeight;
  let top=useBelow?low+gap:Math.max(pad, g.top-gap-h);
  if(top+h>window.innerHeight-pad) top=Math.max(pad, window.innerHeight-pad-h);
  let left=g.midX-w/2;
  left=Math.min(Math.max(pad,left), window.innerWidth-pad-w);
  fly.style.left=left+"px";
  fly.style.top=top+"px";
}
function roadRadius(){
  const map=$("mapcover").getBoundingClientRect();
  const view=$("mapstage").getBoundingClientRect();
  const left=Math.max(map.left, view.left);
  const right=Math.min(map.right, view.right);
  return Math.max(80, (right-left)*0.135);
}
function setRoads(city){
  const el=$("roads");
  if(!city){ el.classList.remove("on"); return; }
  const h=HOTS.find(x=>x.city===city);
  if(!h){ el.classList.remove("on"); return; }
  el.style.setProperty("--rx", h.cx+"%");
  el.style.setProperty("--ry", h.cy+"%");
  el.style.setProperty("--rr", roadRadius().toFixed(1)+"px");
  el.classList.add("on");
}
function markHot(){
  document.querySelectorAll(".hot").forEach(b=>b.classList.toggle("on", b.getAttribute("aria-label")===flyCity));
}
function openFly(city,sticky){
  clearTimeout(flyTimer);
  flyCity=city;
  if(sticky) flySticky=true;
  markHot();
  renderFly();
  $("fly").hidden=false;
  placeFly();
  setRoads(city);
}
function closeFly(){
  clearTimeout(flyTimer);
  flySticky=false;
  flyCity=null;
  $("fly").hidden=true;
  markHot();
  setRoads(null);
}
function layoutMap(){
  const stage=$("mapstage");
  const viewW=stage.clientWidth, viewH=stage.clientHeight;
  if(!viewW||!viewH) return;
  const vFrac=Y1-Y0;
  let scale=viewH/(vFrac*IMG_H);
  const allSpan=(ALL_X1-ALL_X0)*IMG_W;
  const mustSpan=(MUST_X1-MUST_X0)*IMG_W+28;
  if(allSpan*scale>viewW){
    const fit=viewW/mustSpan;
    if(fit<scale) scale=fit;
  }
  const dispW=IMG_W*scale, dispH=IMG_H*scale;
  let top;
  if(dispH<=viewH+0.5) top=(viewH-dispH)/2;
  else{
    top=-Y0*dispH;
    if(top>0) top=0;
    if(top+dispH<viewH) top=viewH-dispH;
  }
  let left;
  const focus=allSpan*scale>viewW+1?(MUST_X0+MUST_X1)/2:MID_X;
  if(dispW<=viewW+0.5) left=(viewW-dispW)/2;
  else{
    left=viewW/2-focus*dispW;
    if(left>0) left=0;
    if(left+dispW<viewW) left=viewW-dispW;
  }
  const cover=$("mapcover");
  cover.style.width=dispW+"px";
  cover.style.height=dispH+"px";
  cover.style.left=left+"px";
  cover.style.top=top+"px";
  cover.style.transform="none";
}
function paintGlow(){
  const src=$("basemap");
  if(!src.naturalWidth) return;
  const nw=src.naturalWidth, nh=src.naturalHeight;
  document.querySelectorAll(".hot").forEach(b=>{
    const zoom=b.querySelector(".zoom");
    const cover=zoom.querySelector(".cover");
    const glow=zoom.querySelector(".glow");
    const bl=parseFloat(b.style.left), bt=parseFloat(b.style.top);
    const bw=parseFloat(b.style.width), bh=parseFloat(b.style.height);
    const left=bl+parseFloat(zoom.style.left)/100*bw;
    const top=bt+parseFloat(zoom.style.top)/100*bh;
    const width=parseFloat(zoom.style.width)/100*bw;
    const height=parseFloat(zoom.style.height)/100*bh;
    const sx=left/100*nw, sy=top/100*nh, sw=width/100*nw, sh=height/100*nh;
    const dw=Math.max(1, Math.round(sw)), dh=Math.max(1, Math.round(sh));
    cover.width=dw; cover.height=dh;
    glow.width=dw; glow.height=dh;
    cover.getContext("2d").drawImage(src, sx, sy, sw, sh, 0, 0, dw, dh);
    const ctx=glow.getContext("2d",{willReadFrequently:true});
    ctx.drawImage(src, sx, sy, sw, sh, 0, 0, dw, dh);
    const image=ctx.getImageData(0,0,dw,dh);
    const d=image.data;
    for(let i=0;i<d.length;i+=4){
      const y=0.2126*d[i]+0.7152*d[i+1]+0.0722*d[i+2];
      d[i+3]=y>=230?255:y>180?Math.round((y-180)/50*255):0;
    }
    ctx.putImageData(image,0,0);
  });
}
function scheduleFlyClose(){
  if(flySticky) return;
  clearTimeout(flyTimer);
  flyTimer=setTimeout(closeFly, 220);
}

function rowHtml(v){
  return `<button type="button" class="row${v.id===selected?" on":""}" data-id="${v.id}">
    <span class="dot" style="background:${v.swatch}"></span>
    <span><b>${esc(v.model)} · ${esc(v.color)}</b>${v.winter?"<span class='flake' title='Pack hiver'>❄</span>":""}
      <span class="meta">${esc(v.plate)} · ${v.battery} % · ${v.surPlace?"Sur place":"Pas sur place"} · ${esc(centerById[v.center].role)}</span></span>
    <span class="pill">${esc(STATUS[v.status])}</span>
  </button>`;
}
function renderList(){
  const rows=FLEET.filter(visible);
  let title="Toute la flotte";
  let detail="";
  if(scope==="city:Strasbourg"){
    title="Strasbourg";
    detail="Store Sales et essai libre-service";
  }else if(scope&&scope.startsWith("city:")) title=scope.slice(5);
  else if(scope){ const c=centerById[scope]; title=c.city+" · "+c.role; }
  $("ptitle").textContent=title;
  $("pcount").textContent=rows.length+" véhicule"+(rows.length>1?"s":"")+(detail?" · "+detail:"");
  const fiche=$("fiche");
  const v=FLEET.find(x=>x.id===selected);
  if(v&&visible(v)){
    const c=centerById[v.center];
    fiche.hidden=false; fiche.className="fiche";
    fiche.innerHTML=`<h3>${esc(v.model)} ${v.winter?"<span class='flake' title='Pack hiver'>❄</span>":""}</h3>
      <dl>
        <dt>Couleur</dt><dd>${esc(v.color)}</dd>
        <dt>Plaque</dt><dd>${esc(v.plate)}</dd>
        <dt>VIN</dt><dd>${esc(v.vin)}</dd>
        <dt>Centre</dt><dd>${esc(c.city)} · ${esc(c.role)}</dd>
        <dt>Statut</dt><dd><span class="pill">${esc(STATUS[v.status])}</span></dd>
        <dt>Batterie</dt><dd>${v.battery} %</dd>
        <dt>Pack hiver</dt><dd>${v.winter?"Oui":"Non"}</dd>
      </dl>`;
  }else{ fiche.hidden=true; fiche.innerHTML=""; }
  const list=$("list");
  if(!rows.length){ list.innerHTML='<p class="empty">Aucun véhicule ne correspond.</p>'; return; }
  if(scope==="city:Strasbourg"){
    list.innerHTML=["sxb-sales","sxb-essai"].map(id=>{
      const part=rows.filter(v=>v.center===id);
      const head=`<h3 class="site">${esc(centerById[id].role)}</h3>`;
      return head+(part.length?part.map(rowHtml).join(""):'<p class="empty">Aucun véhicule.</p>');
    }).join("");
  }else list.innerHTML=rows.map(rowHtml).join("");
  list.querySelectorAll(".row").forEach(btn=>btn.addEventListener("click",()=>openVehicle(btn.dataset.id)));
}
function openSheet(){ $("sheet").hidden=false; renderList(); }
function openVehicle(id){
  const v=FLEET.find(x=>x.id===id); if(!v) return;
  selected=id;
  openSheet();
}
function renderSuggest(){
  const box=$("suggest");
  const q=vinKey($("q").value);
  if(q.length<3){ box.hidden=true; box.innerHTML=""; return; }
  const hits=FLEET.filter(v=>vinKey(v.vin).endsWith(q));
  box.hidden=false;
  if(!hits.length){ box.innerHTML='<p class="empty">Aucun véhicule</p>'; return; }
  box.innerHTML=hits.map(v=>{
    const c=centerById[v.center];
    const here=v.surPlace;
    return `<button type="button" class="flyrow" data-city="${esc(c.city)}">
      <div class="fly-top"><span class="fly-vin">${esc(v.vin)}</span>
        <span class="fly-bat"><span class="bar"><i style="width:${v.battery}%;background:${batColor(v.battery)}"></i></span>${v.battery} %</span></div>
      <div class="fly-here"><span class="here${here?" on":""}"></span>${here?"Sur place":"Pas sur place"}</div>
      <div class="fly-sub">${esc(c.city)} · ${esc(c.role)}</div>
    </button>`;
  }).join("");
  box.querySelectorAll("button").forEach(b=>b.addEventListener("click",e=>{
    e.stopPropagation();
    box.hidden=true;
    openFly(b.dataset.city,true);
  }));
}
$("q").addEventListener("input",()=>{ closeFly(); renderSuggest(); });
$("close").addEventListener("click",()=>{ $("sheet").hidden=true; selected=null; scope=null; });
$("fly").addEventListener("pointerenter",()=>clearTimeout(flyTimer));
$("fly").addEventListener("pointerleave",scheduleFlyClose);
document.addEventListener("click",e=>{
  if(!e.target.closest(".search")) $("suggest").hidden=true;
  if(e.target.closest("#fly")||e.target.closest(".hot")||e.target.closest(".search")) return;
  closeFly();
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){ $("suggest").hidden=true; closeFly(); $("close").click(); }
});
drawCities();
layoutMap();
paintGlow();
$("basemap").addEventListener("load", paintGlow);
requestAnimationFrame(()=>{ const roads=$("roads"); if(!roads.getAttribute("src")) roads.src="carte-alsace-routes.webp"; });
window.addEventListener("resize",()=>{ layoutMap(); if(flyCity){ placeFly(); setRoads(flyCity); } });
</script>
