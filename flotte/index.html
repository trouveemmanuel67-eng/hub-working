<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flotte Strasbourg Sales</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#000;color:#fff;font-family:Inter,"Helvetica Neue",Helvetica,Arial,sans-serif;font-weight:400}
body{min-height:100%}
button,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
.demo{margin:0;padding:7px 14px;text-align:center;font-size:11px;letter-spacing:.04em;color:#8e8e93}
.appbar{position:relative;display:flex;align-items:center;justify-content:space-between;height:52px;padding:0 14px}
.appbar h1{position:absolute;left:58px;right:58px;margin:0;text-align:center;font-size:17px;font-weight:500;letter-spacing:-.01em;pointer-events:none}
.iconbtn{width:36px;height:36px;display:grid;place-items:center;color:#f2f2f2}
.avatar{width:32px;height:32px;border-radius:50%;border:1px solid #3a3a3c;background:#1c1c1e;display:grid;place-items:center}
.avatar span{font-size:11px;letter-spacing:.04em;color:#d1d1d6}
.hero{position:relative;height:min(58vh,520px);min-height:320px;background:#0b0c0e}
#map{width:100%;height:100%;display:block}
.search{position:absolute;left:16px;right:16px;top:12px;z-index:3;display:flex;align-items:center;gap:8px;background:rgba(12,12,14,.55);border:1px solid rgba(255,255,255,.16);border-radius:999px;padding:11px 16px;backdrop-filter:blur(12px)}
.search input{flex:1;min-width:0;border:0;outline:none;background:transparent;font-size:16px}
.search input::placeholder{color:rgba(255,255,255,.5)}
.stamp{position:absolute;left:14px;bottom:76px;z-index:3;font-size:12px;color:rgba(255,255,255,.72);background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.12);border-radius:999px;padding:6px 10px}
.gold{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);z-index:4;border-radius:999px;padding:15px 36px;font-size:17px;font-weight:600;letter-spacing:.01em;color:#241b0d;background:linear-gradient(180deg,#f6e7bf,#e4c27a 46%,#b8893e);box-shadow:0 8px 22px rgba(0,0,0,.35)}
.city{cursor:pointer}
.city .name{fill:#fff;font-family:Inter,"Helvetica Neue",Helvetica,Arial,sans-serif;font-size:30px;font-weight:500}
.city .role{fill:#c7c7cc;font-family:Inter,"Helvetica Neue",Helvetica,Arial,sans-serif;font-size:11px;letter-spacing:.12em}
.car{cursor:pointer}
.zones{padding:22px 0 28px}
.zones h2{margin:0 0 14px;text-align:center;font-size:15px;font-weight:400;color:#8e8e93}
.carousel{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:0 16px 8px;scrollbar-width:none}
.carousel::-webkit-scrollbar{display:none}
.zcard{flex:0 0 min(78vw,320px);scroll-snap-align:center;border-radius:16px;overflow:hidden;border:1px solid #2c2c2e;background:#141416;padding:0;text-align:left}
.zcard svg{width:100%;height:210px;display:block;background:#2a2c30}
.dots{display:flex;justify-content:center;gap:7px;padding-top:8px}
.dots button{width:6px;height:6px;border-radius:50%;background:#3a3a3c}
.dots button.on{background:#f2f2f2}
.sheet{position:fixed;inset:0;z-index:20;background:#000;display:flex;flex-direction:column}
.sheet[hidden]{display:none}
.sh{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:16px 16px 8px}
.sh h2{margin:0;font-size:22px;font-weight:500}
.sh p{margin:6px 0 0;color:#8e8e93;font-size:13px}
.x{width:32px;height:32px;border-radius:50%;border:1px solid #3a3a3c;color:#fff}
.fiche{margin:8px 16px;padding:14px;border-radius:16px;background:#141416;border:1px solid #2c2c2e}
.fiche h3{margin:0 0 8px;font-size:18px;font-weight:500}
.fiche dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px}
.fiche dt{color:#8e8e93}
.fiche dd{margin:0}
.list{overflow:auto;padding:8px 16px 24px}
.row{width:100%;text-align:left;display:grid;grid-template-columns:12px 1fr auto;gap:10px;align-items:center;padding:14px;margin:0 0 10px;border-radius:16px;border:1px solid #2c2c2e;background:#141416}
.row.on{border-color:#8e8e93}
.dot{width:12px;height:12px;border-radius:50%}
.row b{font-weight:500}
.meta{display:block;color:#8e8e93;font-size:12px;margin-top:3px}
.flake{margin-left:4px}
.pill{font-size:11px;border-radius:999px;padding:4px 8px;border:1px solid #3a3a3c;color:#d1d1d6;white-space:nowrap}
.empty{color:#8e8e93}
:focus-visible{outline:2px solid #fff;outline-offset:2px}
@media(min-width:900px){
  .hero{height:min(62vh,540px)}
  .stamp{bottom:18px}
  .zcard{flex-basis:300px}
  .sheet{left:auto;width:420px;border-left:1px solid #2c2c2e}
}
</style>
</head>
<body>
<p class="demo">Données fictives de démonstration</p>
<header class="appbar">
  <button type="button" class="iconbtn" aria-label="Messages">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M5 6.5h14v9H8l-3 2.5z" stroke-linejoin="round"/></svg>
  </button>
  <h1>Flotte Strasbourg Sales</h1>
  <button type="button" class="avatar" aria-label="Profil"><span>ES</span></button>
</header>
<section class="hero">
  <label class="search"><span aria-hidden="true">⌕</span>
    <input id="q" type="search" placeholder="Ville, plaque, VIN, pack hiver" autocomplete="off" aria-label="Rechercher un véhicule">
  </label>
  <svg id="map" viewBox="0 0 1000 720" role="img" aria-label="Carte de l'Alsace et de la flotte">
    <defs>
      <radialGradient id="relief" cx="42%" cy="48%" r="68%">
        <stop offset="0" stop-color="#23262b"/>

      </filter>
    </defs>

    <ellipse cx="180" cy="160" rx="110" ry="80" fill="#262a30"/>

    <g fill="none" stroke="#8fb4d4" stroke-linecap="round">
      <path d="M150 360 C 230 300, 300 230, 370 200 C 470 240, 530 310, 610 390" stroke-width="3" opacity=".35"/>
      <path d="M150 360 C 230 300, 300 230, 370 200 C 470 240, 530 310, 610 390" stroke-width="1.5"/>
      <path d="M800 40 C 770 130, 800 210, 760 300 C 700 400, 620 470, 560 560" stroke-width="3" opacity=".35"/>
      <path d="M800 40 C 770 130, 800 210, 760 300 C 700 400, 620 470, 560 560" stroke-width="1.5"/>
      <path d="M840 155 C 790 190, 760 240, 700 300" stroke-width="1.4"/>
      <path d="M560 560 C 590 500, 610 450, 640 400" stroke-width="1.3" opacity=".85"/>
    </g>
    <g id="cars"></g>
    <g id="cities"></g>
  </svg>
  <div class="stamp" id="stamp">Mis à jour il y a 0 s</div>
  <button type="button" class="gold" id="all">Voir la flotte</button>
</section>
<section class="zones">
  <h2>Nos centres</h2>
  <div class="carousel" id="carousel"></div>
  <div class="dots" id="dots"></div>
</section>
<aside class="sheet" id="sheet" hidden>
  <div class="sh">
    <div>
      <h2 id="ptitle">Flotte</h2>
      <p id="pcount"></p>
    </div>
    <button type="button" class="x" id="close" aria-label="Fermer">✕</button>
  </div>
  <div id="fiche"></div>
  <div class="list" id="list"></div>
</aside>
<script>
/* Centres. x et y : position sur la carte principale (viewBox 0 0 1000 720), nord en haut.
   Les deux sites de Strasbourg sont volontairement proches.
   SIDEKICK peut déplacer un centre sans changer le reste des données. */
const CENTERS = [
  { id:"sxb-sales", city:"Strasbourg", role:"Store Sales", kind:"store", x:600, y:400 },
  { id:"sxb-essai", city:"Strasbourg", role:"Essai libre-service", kind:"essai", x:648, y:368 },
  { id:"rop", city:"Roppenheim", role:"Essai libre-service", kind:"essai", x:835, y:155 },
  { id:"sel", city:"Sélestat", role:"Essai libre-service", kind:"essai", x:545, y:560 },
  { id:"sav", city:"Saverne", role:"Essai libre-service", kind:"essai", x:370, y:200 },
  { id:"sar", city:"Sarrebourg", role:"Essai libre-service", kind:"essai", x:175, y:355 }
];

/* FLOTTE FICTIVE DE DÉMONSTRATION.
   SIDEKICK : remplace uniquement ce tableau par les véhicules réels.
   Champs :
   - id       identifiant interne
   - model    « Model 3 » ou « Model Y »
   - color    nom de couleur affiché
   - swatch   couleur du point sur la carte
   - vin      VIN factice (contient TEST)
   - plate    plaque factice au format AA-123-AA
   - center   id d'un centre de CENTERS
   - status   disponible | en essai | en charge | indisponible
   - battery  pourcentage de batterie
   - winter   true si le véhicule a le pack hiver
   - x, y     position de départ sur la carte */
const FLEET = [
  { id:"v01", model:"Model Y", color:"Blanc", swatch:"#f4f1ea", vin:"LRWY0TEST0000001", plate:"FT-101-AL", center:"sxb-sales", status:"disponible", battery:86, winter:true, x:582, y:388 },
  { id:"v02", model:"Model 3", color:"Noir", swatch:"#2c2e33", vin:"LRW30TEST0000002", plate:"FT-118-SX", center:"sxb-sales", status:"en essai", battery:64, winter:false, x:618, y:416 },
  { id:"v03", model:"Model Y", color:"Bleu", swatch:"#8aa4b5", vin:"LRWY0TEST0000003", plate:"FT-132-AL", center:"sxb-sales", status:"disponible", battery:91, winter:true, x:568, y:412 },
  { id:"v04", model:"Model 3", color:"Rouge", swatch:"#9a6a6a", vin:"LRW30TEST0000004", plate:"FT-145-ST", center:"sxb-sales", status:"en charge", battery:41, winter:false, x:632, y:392 },
  { id:"v05", model:"Model Y", color:"Gris", swatch:"#b0b3b8", vin:"LRWY0TEST0000005", plate:"FT-160-SX", center:"sxb-sales", status:"disponible", battery:73, winter:true, x:608, y:432 },
  { id:"v06", model:"Model 3", color:"Blanc", swatch:"#f7f4ee", vin:"LRW30TEST0000006", plate:"FT-173-AL", center:"sxb-sales", status:"indisponible", battery:19, winter:false, x:560, y:372 },
  { id:"v07", model:"Model Y", color:"Noir", swatch:"#3a3d44", vin:"LRWY0TEST0000007", plate:"FT-186-ST", center:"sxb-sales", status:"en essai", battery:88, winter:true, x:636, y:424 },
  { id:"v08", model:"Model 3", color:"Gris", swatch:"#b0b3b8", vin:"LRW30TEST0000008", plate:"FT-201-AL", center:"sxb-essai", status:"disponible", battery:77, winter:false, x:630, y:352 },
  { id:"v09", model:"Model Y", color:"Blanc", swatch:"#f4f1ea", vin:"LRWY0TEST0000009", plate:"FT-214-SX", center:"sxb-essai", status:"disponible", battery:95, winter:true, x:668, y:380 },
  { id:"v10", model:"Model 3", color:"Bleu", swatch:"#8aa4b5", vin:"LRW30TEST0000010", plate:"FT-227-ST", center:"sxb-essai", status:"en essai", battery:52, winter:false, x:622, y:386 },
  { id:"v11", model:"Model Y", color:"Rouge", swatch:"#9a6a6a", vin:"LRWY0TEST0000011", plate:"FT-240-AL", center:"sxb-essai", status:"en charge", battery:33, winter:true, x:676, y:356 },
  { id:"v12", model:"Model 3", color:"Noir", swatch:"#3a3d44", vin:"LRW30TEST0000012", plate:"FT-253-SX", center:"sxb-essai", status:"indisponible", battery:68, winter:false, x:652, y:334 },
  { id:"v13", model:"Model Y", color:"Blanc", swatch:"#f4f1ea", vin:"LRWY0TEST0000013", plate:"FT-301-AL", center:"rop", status:"disponible", battery:81, winter:true, x:814, y:138 },
  { id:"v14", model:"Model 3", color:"Bleu", swatch:"#8aa4b5", vin:"LRW30TEST0000014", plate:"FT-314-ST", center:"rop", status:"en essai", battery:58, winter:false, x:862, y:172 },
  { id:"v15", model:"Model Y", color:"Gris", swatch:"#b0b3b8", vin:"LRWY0TEST0000015", plate:"FT-327-SX", center:"rop", status:"disponible", battery:90, winter:true, x:820, y:182 },
  { id:"v16", model:"Model 3", color:"Rouge", swatch:"#9a6a6a", vin:"LRW30TEST0000016", plate:"FT-340-AL", center:"rop", status:"en charge", battery:27, winter:false, x:792, y:170 },
  { id:"v17", model:"Model Y", color:"Noir", swatch:"#3a3d44", vin:"LRWY0TEST0000017", plate:"FT-353-ST", center:"rop", status:"disponible", battery:74, winter:false, x:854, y:128 },
  { id:"v18", model:"Model 3", color:"Blanc", swatch:"#f7f4ee", vin:"LRW30TEST0000018", plate:"FT-401-AL", center:"sel", status:"disponible", battery:83, winter:true, x:522, y:542 },
  { id:"v19", model:"Model Y", color:"Bleu", swatch:"#8aa4b5", vin:"LRWY0TEST0000019", plate:"FT-414-SX", center:"sel", status:"en essai", battery:66, winter:true, x:572, y:574 },
  { id:"v20", model:"Model 3", color:"Gris", swatch:"#b0b3b8", vin:"LRW30TEST0000020", plate:"FT-427-ST", center:"sel", status:"disponible", battery:49, winter:false, x:506, y:584 },
  { id:"v21", model:"Model Y", color:"Blanc", swatch:"#f4f1ea", vin:"LRWY0TEST0000021", plate:"FT-440-AL", center:"sel", status:"disponible", battery:92, winter:true, x:582, y:538 },
  { id:"v22", model:"Model 3", color:"Noir", swatch:"#3a3d44", vin:"LRW30TEST0000022", plate:"FT-453-SX", center:"sel", status:"indisponible", battery:15, winter:false, x:532, y:598 },
  { id:"v23", model:"Model Y", color:"Rouge", swatch:"#9a6a6a", vin:"LRWY0TEST0000023", plate:"FT-466-ST", center:"sel", status:"en charge", battery:71, winter:true, x:490, y:554 },
  { id:"v24", model:"Model Y", color:"Blanc", swatch:"#f4f1ea", vin:"LRWY0TEST0000024", plate:"FT-501-AL", center:"sav", status:"disponible", battery:79, winter:true, x:348, y:184 },
  { id:"v25", model:"Model 3", color:"Bleu", swatch:"#8aa4b5", vin:"LRW30TEST0000025", plate:"FT-514-SX", center:"sav", status:"en essai", battery:55, winter:false, x:402, y:222 },
  { id:"v26", model:"Model Y", color:"Gris", swatch:"#b0b3b8", vin:"LRWY0TEST0000026", plate:"FT-527-ST", center:"sav", status:"disponible", battery:87, winter:true, x:338, y:230 },
  { id:"v27", model:"Model 3", color:"Rouge", swatch:"#9a6a6a", vin:"LRW30TEST0000027", plate:"FT-540-AL", center:"sav", status:"en charge", battery:38, winter:false, x:416, y:180 },
  { id:"v28", model:"Model 3", color:"Blanc", swatch:"#f7f4ee", vin:"LRW30TEST0000028", plate:"FT-601-AL", center:"sar", status:"disponible", battery:80, winter:false, x:154, y:338 },
  { id:"v29", model:"Model Y", color:"Noir", swatch:"#3a3d44", vin:"LRWY0TEST0000029", plate:"FT-614-SX", center:"sar", status:"en essai", battery:63, winter:true, x:206, y:374 },
  { id:"v30", model:"Model 3", color:"Gris", swatch:"#b0b3b8", vin:"LRW30TEST0000030", plate:"FT-627-ST", center:"sar", status:"en charge", battery:44, winter:false, x:142, y:384 },
  { id:"v31", model:"Model Y", color:"Blanc", swatch:"#f4f1ea", vin:"LRWY0TEST0000031", plate:"FT-640-AL", center:"sar", status:"disponible", battery:96, winter:true, x:208, y:332 },
  { id:"v32", model:"Model 3", color:"Bleu", swatch:"#8aa4b5", vin:"LRW30TEST0000032", plate:"FT-653-SX", center:"sar", status:"indisponible", battery:22, winter:false, x:178, y:398 }
];

const STATUS = { disponible:"Disponible", "en essai":"En essai", "en charge":"En charge", indisponible:"Indisponible" };
const $=id=>document.getElementById(id);
const centerById=Object.fromEntries(CENTERS.map(c=>[c.id,c]));
FLEET.forEach((v,i)=>{ v.phase=i*0.7; });
let scope=null, selected=null, query="", lastPulse=Date.now();
const view={x:0,y:0,w:1000,h:720};
let target={...view};
setInterval(()=>{ lastPulse=Date.now(); }, 4000);

function norm(s){return String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase()}
function esc(s){return String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]))}
function place(v,t){return {x:v.x+Math.sin(t/1400+v.phase)*7, y:v.y+Math.cos(t/1700+v.phase)*5}}
function hit(v){
  const q=norm(query).trim();
  if(!q) return true;
  const c=centerById[v.center];
  const blob=norm([v.model,v.color,v.vin,v.plate,c.city,c.role,v.status,v.winter?"pack hiver":""].join(" "));
  return blob.includes(q);
}
function inScope(v){
  if(!scope) return true;
  if(scope.startsWith("city:")) return centerById[v.center].city===scope.slice(5);
  return v.center===scope;
}
function visible(v){return hit(v)&&inScope(v)}
function stampText(){return "Mis à jour il y a "+Math.max(0,Math.round((Date.now()-lastPulse)/1000))+" s"}

function drawCities(){
  const g=$("cities");
  g.innerHTML="";
  const seen=new Set();
  for(const c of CENTERS){
    if(seen.has(c.city)) continue;
    seen.add(c.city);
    const mates=CENTERS.filter(x=>x.city===c.city);
    const x=mates.reduce((s,m)=>s+m.x,0)/mates.length;
    const y=Math.min(...mates.map(m=>m.y))-18;
    const node=document.createElementNS("http://www.w3.org/2000/svg","g");
    node.setAttribute("class","city");
    node.setAttribute("tabindex","0");
    node.setAttribute("role","button");
    node.setAttribute("aria-label",c.city);
    const name=document.createElementNS("http://www.w3.org/2000/svg","text");
    name.setAttribute("class","name");
    name.setAttribute("x",x); name.setAttribute("y",y);
    name.setAttribute("text-anchor","middle");
    name.setAttribute("filter","url(#halo)");
    name.textContent=c.city;
    node.append(name);
    const open=()=>openCity(c.city);
    node.addEventListener("click",open);
    node.addEventListener("keydown",e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); open(); }});
    g.append(node);
  }
  for(const c of CENTERS){
    const pin=document.createElementNS("http://www.w3.org/2000/svg","circle");
    pin.setAttribute("cx",c.x); pin.setAttribute("cy",c.y); pin.setAttribute("r","4.5");
    pin.setAttribute("fill",c.kind==="store"?"#f2f2f2":"#c7c7cc");
    pin.setAttribute("stroke","#000"); pin.setAttribute("stroke-width","1");
    pin.style.cursor="pointer";
    pin.addEventListener("click",e=>{ e.stopPropagation(); openCenter(c.id); });
    g.append(pin);
  }
}
function paintCar(dot,v,t){
  const p=place(v,t);
  dot.setAttribute("cx",p.x); dot.setAttribute("cy",p.y);
  dot.setAttribute("r",selected===v.id?"7.5":"5");
  dot.setAttribute("stroke",selected===v.id?"#fff":"#111");
  dot.setAttribute("stroke-width",selected===v.id?"2":"1");
  dot.setAttribute("opacity",hit(v)?"1":".2");
}
function drawCars(t){
  const g=$("cars");
  if(g.childElementCount!==FLEET.length){
    g.innerHTML="";
    for(const v of FLEET){
      const dot=document.createElementNS("http://www.w3.org/2000/svg","circle");
      dot.setAttribute("class","car");
      dot.setAttribute("fill",v.swatch);
      dot.setAttribute("tabindex","0");
      dot.setAttribute("role","button");
      dot.setAttribute("aria-label",v.model+" "+v.plate);
      const go=()=>openVehicle(v.id);
      dot.addEventListener("click",e=>{ e.stopPropagation(); go(); });
      dot.addEventListener("keydown",e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); go(); }});
      g.append(dot);
    }
  }
  [...g.children].forEach((dot,i)=>paintCar(dot,FLEET[i],t));
}

function mini(c){
  const cars=FLEET.filter(v=>v.center===c.id);
  const xs=cars.map(v=>v.x), ys=cars.map(v=>v.y);
  const minX=Math.min(...xs)-18, maxX=Math.max(...xs)+18, minY=Math.min(...ys)-18, maxY=Math.max(...ys)+18;
  const X=x=>20+((x-minX)/(maxX-minX||1))*150;
  const Y=y=>36+((y-minY)/(maxY-minY||1))*88;
  const streets=[0,1,2,3,4].map(i=>`<path d="M6 ${28+i*22} H194" stroke="#6e7278" stroke-width="1"/>`).join("")
    +[0,1,2,3].map(i=>`<path d="M${24+i*46} 8 V132" stroke="#6e7278" stroke-width="1"/>`).join("");
  const dots=cars.map(v=>`<circle cx="${X(v.x).toFixed(1)}" cy="${Y(v.y).toFixed(1)}" r="3.2" fill="${v.swatch}" stroke="#111" stroke-width=".6"/>`).join("");
  const label=c.city+(c.kind==="store"?" · Store":" · Essai");
  const w=Math.min(186, 28+label.length*7.6);
  return `<svg viewBox="0 0 200 140" aria-hidden="true">
    <rect width="200" height="140" fill="#2a2c30"/>
    ${streets}
    <path d="M36 34 L158 28 L176 62 L150 112 L46 118 L22 72 Z" fill="rgba(255,255,255,.08)" stroke="#d8d8dc" stroke-width="1.2"/>
    <rect x="8" y="8" rx="8" width="${w}" height="26" fill="#000" stroke="#3a3a3c"/>
    <text x="16" y="25" fill="#fff" font-size="11" font-family="Inter,Helvetica,Arial,sans-serif">${esc(label)}</text>
    ${dots}
  </svg>`;
}
function drawCarousel(){
  const box=$("carousel"), dots=$("dots");
  box.innerHTML=CENTERS.map(c=>`<button type="button" class="zcard" data-id="${c.id}" aria-label="${esc(c.city)} ${esc(c.role)}">${mini(c)}</button>`).join("");
  dots.innerHTML=CENTERS.map((_,i)=>`<button type="button" data-i="${i}" aria-label="Centre ${i+1}"></button>`).join("");
  box.querySelectorAll(".zcard").forEach(b=>b.addEventListener("click",()=>openCenter(b.dataset.id)));
  dots.querySelectorAll("button").forEach(b=>b.addEventListener("click",()=>{
    const card=box.children[+b.dataset.i];
    card.scrollIntoView({behavior:"smooth",inline:"center",block:"nearest"});
  }));
  const mark=()=>{
    const mid=box.scrollLeft+box.clientWidth/2;
    let best=0, dist=1e9;
    [...box.children].forEach((el,i)=>{
      const c=el.offsetLeft+el.offsetWidth/2;
      if(Math.abs(c-mid)<dist){dist=Math.abs(c-mid); best=i;}
    });
    dots.querySelectorAll("button").forEach((d,i)=>d.classList.toggle("on",i===best));
  };
  box.addEventListener("scroll",mark,{passive:true});
  mark();
}

function renderList(){
  const rows=FLEET.filter(visible);
  let title="Toute la flotte";
  if(scope&&scope.startsWith("city:")) title=scope.slice(5);
  else if(scope){ const c=centerById[scope]; title=c.city+" · "+c.role; }
  $("ptitle").textContent=title;
  $("pcount").textContent=rows.length+" véhicule"+(rows.length>1?"s":"")+" · "+stampText();
  const fiche=$("fiche");
  const v=FLEET.find(x=>x.id===selected);
  if(v&&visible(v)){
    const c=centerById[v.center];
    fiche.hidden=false; fiche.className="fiche";
    fiche.innerHTML=`<h3>${esc(v.model)} ${v.winter?"<span class='flake' title='Pack hiver'>❄</span>":""}</h3>
      <dl>
        <dt>Couleur</dt><dd>${esc(v.color)}</dd>
        <dt>Plaque</dt><dd>${esc(v.plate)}</dd>
        <dt>VIN</dt><dd>${esc(v.vin)}</dd>
        <dt>Centre</dt><dd>${esc(c.city)} · ${esc(c.role)}</dd>
        <dt>Statut</dt><dd><span class="pill">${esc(STATUS[v.status])}</span></dd>
        <dt>Batterie</dt><dd>${v.battery} %</dd>
        <dt>Pack hiver</dt><dd>${v.winter?"Oui":"Non"}</dd>
        <dt>Position</dt><dd>Sur la carte, secteur ${esc(c.city)}</dd>
      </dl>`;
  }else{ fiche.hidden=true; fiche.innerHTML=""; }
  const list=$("list");
  if(!rows.length){ list.innerHTML='<p class="empty">Aucun véhicule ne correspond.</p>'; return; }
  list.innerHTML=rows.map(v=>`<button type="button" class="row${v.id===selected?" on":""}" data-id="${v.id}">
    <span class="dot" style="background:${v.swatch}"></span>
    <span><b>${esc(v.model)} · ${esc(v.color)}</b>${v.winter?"<span class='flake' title='Pack hiver'>❄</span>":""}
      <span class="meta">${esc(v.plate)} · ${v.battery} % · ${esc(centerById[v.center].role)}</span></span>
    <span class="pill">${esc(STATUS[v.status])}</span>
  </button>`).join("");
  list.querySelectorAll(".row").forEach(btn=>btn.addEventListener("click",()=>openVehicle(btn.dataset.id)));
}
function openSheet(){ $("sheet").hidden=false; renderList(); }
function openCity(city){ scope="city:"+city; selected=null; resetView(); openSheet(); drawCars(performance.now()); }
function openCenter(id){ scope=id; selected=null; resetView(); openSheet(); drawCars(performance.now()); }
function openAll(){ scope=null; selected=null; query=""; $("q").value=""; resetView(); openSheet(); drawCars(performance.now()); }
function openVehicle(id){
  const v=FLEET.find(x=>x.id===id); if(!v) return;
  selected=id; scope=v.center;
  const p=place(v,performance.now());
  target={x:p.x-280,y:p.y-200,w:560,h:400};
  openSheet(); drawCars(performance.now());
}
function resetView(){ target={x:0,y:0,w:1000,h:720}; }
function tick(t){
  $("stamp").textContent=stampText();
  if(!$("sheet").hidden) $("pcount").textContent=FLEET.filter(visible).length+" véhicule"+(FLEET.filter(visible).length>1?"s":"")+" · "+stampText();
  drawCars(t);
  view.x+=(target.x-view.x)*.12; view.y+=(target.y-view.y)*.12;
  view.w+=(target.w-view.w)*.12; view.h+=(target.h-view.h)*.12;
  $("map").setAttribute("viewBox",`${view.x.toFixed(1)} ${view.y.toFixed(1)} ${view.w.toFixed(1)} ${view.h.toFixed(1)}`);
  requestAnimationFrame(tick);
}
$("q").addEventListener("input",e=>{
  query=e.target.value;
  if(query.trim()){ scope=null; selected=null; openSheet(); }
  else renderList();
  drawCars(performance.now());
});
$("all").addEventListener("click",openAll);
$("close").addEventListener("click",()=>{ $("sheet").hidden=true; selected=null; scope=null; resetView(); drawCars(performance.now()); });
document.addEventListener("keydown",e=>{ if(e.key==="Escape") $("close").click(); });
drawCities();
drawCarousel();
requestAnimationFrame(tick);
</script>
</body>
</html>
